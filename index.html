願の協議が不成立でも、くじで1つは登録される場合があります。"}, {"id": "53g7", "exam": 53, "part": "学科", "no": 7, "ans": "ウ", "type": "choice", "stem": "ア～ウを比較して，特許法における新規性喪失の例外規定に関して，最も適切と考えられるものはどれか。", "opts": [{"k": "ア", "t": "特許を受ける権利を有する者の意に反して公知となった発明について特許出願する場合，特許出願の日から3カ月以内にそのことを証明する書面を提出した場合でなければ，新規性喪失の例外規定の適用を受けることができない。"}, {"k": "イ", "t": "特許を受ける権利を有する者の行為に起因して公知となった発明について特許出願する場合，特許出願の日から30日以内に新規性喪失の例外規定の適用を受けたい旨を記載した書面を提出すれば，新規性喪失の例外規定の適用を受けることができる。"}, {"k": "ウ", "t": "特許を受ける権利を有する者の行為に起因して公知となった発明について特許出願する場合，当該発明が公知となった日から1年以内に出願しなければ，新規性喪失の例外規定の適用を受けることができない。"}], "neg": false, "topic": "特許", "exp": "新規性喪失の例外は、公知になった日から1年以内の出願が必要です。適用を受けたい旨の書面は出願と同時、証明書は出願日から30日以内に出します。"}, {"id": "53g8", "exam": 53, "part": "学科", "no": 8, "ans": "ウ", "type": "choice", "stem": "ア～ウを比較して，実演家人格権として，最も不適切と考えられるものはどれか。", "opts": [{"k": "ア", "t": "氏名表示権"}, {"k": "イ", "t": "同一性保持権"}, {"k": "ウ", "t": "公表権"}], "neg": true, "topic": "著作権", "exp": "実演家人格権は、氏名表示権と同一性保持権です。公表権はありません。"}, {"id": "53g9", "exam": 53, "part": "学科", "no": 9, "ans": "ア", "type": "choice", "stem": "ア～ウを比較して，弁理士法上，弁理士が他人の求めに応じ報酬を得て行うことができる独占業務とされているものとして，最も適切と考えられるものはどれか。", "opts": [{"k": "ア", "t": "特許出願の手続"}, {"k": "イ", "t": "特許料の納付手続"}, {"k": "ウ", "t": "特許原簿への登録申請手続"}], "neg": false, "topic": "その他", "exp": "弁理士の独占業務は、特許出願手続の代理です。選択肢ではアが最も適切です。"}, {"id": "53g10", "exam": 53, "part": "学科", "no": 10, "ans": "ア", "type": "choice", "stem": "ア～ウを比較して，著作隣接権等に関して，最も適切と考えられるものはどれか。", "opts": [{"k": "ア", "t": "公表された映画の著作物の著作権の存続期間は，その著作物の公表後70年を経過するまでである。"}, {"k": "イ", "t": "レコード製作者の権利は，そのレコードの公表日に発生する。"}, {"k": "ウ", "t": "放送に関する著作隣接権の存続期間は，その放送後70年を経過するまでである。"}], "neg": false, "topic": "著作権", "exp": "映画の著作物の著作権は公表後70年です。レコード製作者の権利は音を最初に固定した時に発生し、放送の著作隣接権は放送後50年です。"}, {"id": "53g11", "exam": 53, "part": "学科", "no": 11, "ans": "ウ", "type": "choice", "stem": "ア～ウを比較して，商標権等に関して，最も適切と考えられるものはどれか。", "opts": [{"k": "ア", "t": "商標権者は，専用使用権を設定した場合であっても，その設定範囲内で登録商標を使用できる場合がある。"}, {"k": "イ", "t": "通常使用権は，登録しなくとも，その発生後にその商標権を取得した者に対して，その効力が生ずる。"}, {"k": "ウ", "t": "他人の商標登録出願の日前から，登録商標と同一の商標を使用し，その出願日において，当該商標が周知であれば，先使用権が認められる場合がある。"}], "neg": false, "topic": "商標", "exp": "他人の出願前から使用し、出願時に周知であれば先使用権があります。専用使用権を設定した範囲では商標権者も使えず、通常使用権は登録しないと第三者に対抗できません。"}, {"id": "53g12", "exam": 53, "part": "学科", "no": 12, "ans": "イ", "type": "choice", "stem": "ア～ウを比較して，実用新案権を行使するために必要な書類として，最も適切と考えられるものはどれか。", "opts": [{"k": "ア", "t": "特許庁が発行した実用新案公報"}, {"k": "イ", "t": "特許庁の審査官が作成した実用新案技術評価書"}, {"k": "ウ", "t": "弁理士が作成した実用新案鑑定書"}], "neg": false, "topic": "実用新案", "exp": "実用新案権の行使には、特許庁の審査官が作成した実用新案技術評価書を提示して警告する必要があります。"}, {"id": "53g13", "exam": 53, "part": "学科", "no": 13, "ans": "イ", "type": "choice", "stem": "ア～ウを比較して，著作権法における頒布に関して，最も適切と考えられるものはどれか。", "opts": [{"k": "ア", "t": "譲渡又は翻案の性質を備える"}, {"k": "イ", "t": "譲渡又は貸与の性質を備える"}, {"k": "ウ", "t": "上映又は翻案の性質を備える"}], "neg": false, "topic": "著作権", "exp": "頒布は、譲渡又は貸与の性質を備えるものです。"}, {"id": "53g14", "exam": 53, "part": "学科", "no": 14, "ans": "イ", "type": "choice", "stem": "ア～ウを比較して，育成者権の侵害に関して，最も不適切と考えられるものはどれか。", "opts": [{"k": "ア", "t": "試験又は研究を目的とした登録品種の利用は，育成者権の侵害とならない。"}, {"k": "イ", "t": "登録品種の名称を育成者権者に無断で使用する行為は，育成者権の侵害となる。"}, {"k": "ウ", "t": "登録品種の種苗を育成者権者に無断で業として生産する行為は，育成者権の侵害となる。"}], "neg": true, "topic": "種苗", "exp": "登録品種の名称そのものを使っても、育成者権の侵害にはなりません。試験・研究目的の利用は侵害にならず、無断で種苗を生産すると侵害です。"}, {"id": "53g15", "exam": 53, "part": "学科", "no": 15, "ans": "ウ", "type": "choice", "stem": "ア～ウを比較して，特許協力条約（PCT）において，国際事務局が行うものとして，最も不適切と考えられるものはどれか。", "opts": [{"k": "ア", "t": "国際出願の受理"}, {"k": "イ", "t": "国際公開"}, {"k": "ウ", "t": "国際予備審査"}], "neg": true, "topic": "条約", "exp": "国際予備審査は国際予備審査機関が行い、国際事務局は行いません。国際公開は国際事務局が行い、国際出願の受理は国際事務局でもできます。"}, {"id": "53g16", "exam": 53, "part": "学科", "no": 16, "ans": "ウ", "type": "choice", "stem": "ア～ウを比較して，不正競争防止法における著名表示冒用行為（不正競争防止法第2条第1項第2号）に関して，最も不適切と考えられるものはどれか。", "opts": [{"k": "ア", "t": "著名表示冒用行為における著名は，いわゆる周知よりもよく知られた状態であることが必要である。"}, {"k": "イ", "t": "著名表示冒用行為には，他人の著名な商品等表示の使用だけでなく，その商品等表示を使用した商品を譲渡，引渡し，譲渡若しくは引渡しのための展示，輸出，輸入，若しくは電気通信回線を通じて提供する行為も含まれる。"}, {"k": "ウ", "t": "単に他人の著名な商品等表示を使用しただけでなく，実際に他人の商品や営業と混同が生じている場合でなければ著名表示冒用行為に該当しない。"}], "neg": true, "topic": "その他", "exp": "著名表示冒用行為は、混同が生じていなくても成立します。混同を要件とするのは、周知表示の混同惹起行為です。"}, {"id": "53g17", "exam": 53, "part": "学科", "no": 17, "ans": "ア", "type": "choice", "stem": "ア～ウを比較して，商標法上の商標等に関して，最も不適切と考えられるものはどれか。", "opts": [{"k": "ア", "t": "サービス（役務）とは，商取引の目的となり得るかを問わず，他人のために行う労務をいう。"}, {"k": "イ", "t": "商標とは，自分の商品やサービスを特徴づけ，他人が提供している他の商品やサービスから区別するために用いられる記号やマーク等をいう。"}, {"k": "ウ", "t": "商品とは，商取引の目的となる物をいう。"}], "neg": true, "topic": "商標", "exp": "サービス（役務）は、「商取引の目的となる」他人のための労務・便益です。「問わず」が誤りです。"}, {"id": "53g18", "exam": 53, "part": "学科", "no": 18, "ans": "ア", "type": "choice", "stem": "ア～ウを比較して，意匠法に規定されている制度に関して，最も不適切と考えられるものはどれか。", "opts": [{"k": "ア", "t": "出願公開制度"}, {"k": "イ", "t": "内装の意匠制度"}, {"k": "ウ", "t": "秘密意匠制度"}], "neg": true, "topic": "意匠", "exp": "意匠法には出願公開制度がありません（登録後に公報で公開します）。内装の意匠と秘密意匠の制度はあります。"}, {"id": "53g19", "exam": 53, "part": "学科", "no": 19, "ans": "イ", "type": "choice", "stem": "ア～ウを比較して，特許法の保護対象に関して，最も適切と考えられるものはどれか。", "opts": [{"k": "ア", "t": "自然法則を利用していないものでも発明に該当する場合がある。"}, {"k": "イ", "t": "天然物や自然現象などの単なる発見は発明に該当しない。"}, {"k": "ウ", "t": "情報の単なる提示でも発明に該当する場合がある。"}], "neg": false, "topic": "特許", "exp": "天然物や自然現象の単なる発見は発明ではありません。発明には自然法則の利用が必要で、情報の単なる提示も発明ではありません。"}, {"id": "53g20", "exam": 53, "part": "学科", "no": 20, "ans": "イ", "type": "choice", "stem": "ア～ウを比較して，編集著作物に関して，最も適切と考えられるものはどれか。", "opts": [{"k": "ア", "t": "データベースの著作物は，データベースの著作物としてだけでなく編集著作物としても保護される。"}, {"k": "イ", "t": "編集著作物とは，編集物であってその素材の選択又は配列によって創作性を有するものである。"}, {"k": "ウ", "t": "編集著作物として保護を受けるためには，素材の著作物の著作権者の許諾を得る必要がある。"}], "neg": false, "topic": "著作権", "exp": "編集著作物は、素材の選択又は配列に創作性がある編集物です。素材の著作権者の許諾は、編集著作物として保護されるための要件ではありません。"}, {"id": "53g21", "exam": 53, "part": "学科", "no": 21, "ans": "イ", "type": "choice", "stem": "ア～ウを比較して，パリ条約に関して，最も適切と考えられるものはどれか。", "opts": [{"k": "ア", "t": "最恵国待遇の原則により，同盟国が他の同盟国の国民に与える利益が，他のすべての同盟国の国民に対しても無条件で与えられる。"}, {"k": "イ", "t": "出願人が同盟国にした最初の特許出願に基づきパリ条約上の優先権を主張して他の同盟国に特許出願をした場合，当該他の同盟国の特許出願には，最初の特許出願時にされたのと同様の利益が与えられる。"}, {"k": "ウ", "t": "優先期間中にされた特許出願について，先に特許出願された同盟国で特許権が付与されると，後に特許出願された他の同盟国でも特許権が付与される。"}], "neg": false, "topic": "条約", "exp": "優先権を主張した出願は、最初の出願時にされたのと同様の利益を受けます。各国の特許は独立しており、最初の国で特許になっても他国で自動的に特許にはなりません。"}, {"id": "53g22", "exam": 53, "part": "学科", "no": 22, "ans": "イ", "type": "choice", "stem": "ア～ウを比較して，共同著作物に関して，最も適切と考えられるものはどれか。", "opts": [{"k": "ア", "t": "複数人が共同して創作した結合著作物は，共同著作物である。"}, {"k": "イ", "t": "複数人が共同して創作した著作物であって，その各人の寄与を分離して個別的に利用することができないものは，共同著作物である。"}, {"k": "ウ", "t": "複数人が共同して著作物を創作した場合，その著作物は常に共同著作物であり，著作権は共有となる。"}], "neg": false, "topic": "著作権", "exp": "各人の寄与を分離して個別に利用できないものが共同著作物です。結合著作物は共同著作物ではありません。"}, {"id": "53g23", "exam": 53, "part": "学科", "no": 23, "ans": "ウ", "type": "choice", "stem": "ア～ウを比較して，意匠登録の要件に関して，最も不適切と考えられるものはどれか。", "opts": [{"k": "ア", "t": "新規性"}, {"k": "イ", "t": "創作非容易性"}, {"k": "ウ", "t": "識別力"}], "neg": true, "topic": "意匠", "exp": "識別力は商標の登録要件です。意匠の要件は新規性・創作非容易性などです。"}, {"id": "53g24", "exam": 53, "part": "学科", "no": 24, "ans": "イ", "type": "choice", "stem": "ア～ウを比較して，特許出願について，拒絶理由通知を受けた特許出願人がとり得る措置として，最も適切と考えられるものはどれか。", "opts": [{"k": "ア", "t": "答弁書を提出する。"}, {"k": "イ", "t": "手続補正書を提出する。"}, {"k": "ウ", "t": "不服審判を請求する。"}], "neg": false, "topic": "特許", "exp": "拒絶理由通知への対応は、意見書・手続補正書の提出です。「答弁書」という手続はなく、不服審判は拒絶査定を受けた後です。"}, {"id": "53g25", "exam": 53, "part": "学科", "no": 25, "ans": "ウ", "type": "choice", "stem": "ア～ウを比較して，著作権法上の引用に関して，最も適切と考えられるものはどれか。", "opts": [{"k": "ア", "t": "未公表の他人の著作物であっても，引用して利用することができる。"}, {"k": "イ", "t": "他人の著作物を引用して利用する場合，引用した著作物の出所を明示する必要はない。"}, {"k": "ウ", "t": "他人の著作物を引用して利用する場合，公正な慣行に合致し，引用の目的上正当な範囲内で行われるものでなければならない。"}], "neg": false, "topic": "著作権", "exp": "引用は、公正な慣行に合致し、引用の目的上正当な範囲内で行う必要があります。公表された著作物が対象で、出所の明示も必要です。"}, {"id": "53g26", "exam": 53, "part": "学科", "no": 26, "ans": "ウ", "type": "choice", "stem": "ア～ウを比較して，商標法に規定されている制度に関して，最も不適切と考えられるものはどれか。", "opts": [{"k": "ア", "t": "登録異議申立制度"}, {"k": "イ", "t": "拒絶査定不服審判制度"}, {"k": "ウ", "t": "延長登録制度"}], "neg": true, "topic": "商標", "exp": "商標法には延長登録制度がありません（あるのは更新登録制度です）。延長登録は、特許の医薬品などの制度です。"}, {"id": "53g27", "exam": 53, "part": "学科", "no": 27, "ans": "ア", "type": "choice", "stem": "ア～ウを比較して，特許権のライセンス契約において，独占禁止法上の問題が生ずる可能性が低い契約内容として，最も適切と考えられるものはどれか。", "opts": [{"k": "ア", "t": "ライセンスに係る製品の販売地域と販売期間をライセンサーが制限すること"}, {"k": "イ", "t": "ライセンシーが開発した改良技術を，ライセンサーのみが実施できる旨を定めること"}, {"k": "ウ", "t": "ライセンスに係る製品の販売価格をライセンサーが制限すること"}], "neg": false, "topic": "その他", "exp": "ライセンス製品の販売地域と期間の制限は、独占禁止法上の問題が生じる可能性が低い内容です。改良技術をライセンサーだけが実施できる条件や、販売価格の制限は問題になりやすいです。"}, {"id": "53g28", "exam": 53, "part": "学科", "no": 28, "ans": "イ", "type": "choice", "stem": "ア～ウを比較して，登録が効力発生要件となる行為として，最も適切と考えられるものはどれか。", "opts": [{"k": "ア", "t": "著作権の公衆送信権の利用許諾"}, {"k": "イ", "t": "意匠権の譲渡"}, {"k": "ウ", "t": "著作者人格権の不行使"}], "neg": false, "topic": "意匠", "exp": "意匠権の譲渡は、登録が効力発生の条件です。著作権の許諾や著作者人格権の不行使は、登録に関係しません。"}, {"id": "53g29", "exam": 53, "part": "学科", "no": 29, "ans": "ア", "type": "choice", "stem": "ア～ウを比較して，特許出願に係る書類に関して，最も適切と考えられるものはどれか。", "opts": [{"k": "ア", "t": "特許出願の際に，願書に添付しなければならない書類は，明細書，特許請求の範囲及び要約書である。"}, {"k": "イ", "t": "明細書の発明の詳細な説明には，その発明の属する技術分野において事業に従事する者が，その発明を実施できる程度に明確かつ十分に記載しなければならない。"}, {"k": "ウ", "t": "特許請求の範囲は，発明の詳細な説明に記載したものであって，明確に記載すれば足りる。"}], "neg": false, "topic": "特許", "exp": "特許出願の願書には、明細書・特許請求の範囲・（必要なら図面）・要約書を添付します。詳細な説明は「当業者が実施できる程度」に書き、「事業に従事する者」は誤りです。"}, {"id": "53g30", "exam": 53, "part": "学科", "no": 30, "ans": "ウ", "type": "choice", "stem": "ア～ウを比較して，著作権法における複製に関して，最も不適切と考えられるものはどれか。", "opts": [{"k": "ア", "t": "個人的な範囲内において使用することを目的とするときは，著作権者の許諾を得ずに著作物を複製することができる。"}, {"k": "イ", "t": "家庭内において使用することを目的とするときは，著作権者の許諾を得ずに著作物を複製することができる。"}, {"k": "ウ", "t": "自社内において業務目的で使用するときは，著作権者の許諾を得ずに著作物を複製することができる。"}], "neg": true, "topic": "著作権", "exp": "私的使用の複製は、個人・家庭内などの限られた範囲です。会社内の業務目的の複製は私的使用に当たらず、許諾が必要です。"}, {"id": "53j1", "exam": 53, "part": "実技", "no": 1, "ans": "×", "ctx": "甲は独自に創作した機能的な事務用椅子の形状に関する発明Aについて，2025年11月10日に特許出願Pをした。一方，乙は独自に創作した発明Aと同じ発明に係る事務用椅子について，2025年9月1日に米国国内の乙の店舗のみにおいて販売を開始した。また，丙は独自に創作した発明Aと同じ発明について，2025年4月1日に特許出願Qをするとともに，出願時に早期審査を申請した後に登録され，2025年11月20日に特許掲載公報が発行された。", "type": "maru", "stem": "特許出願Pについて，乙の行為により，拒絶されないと考えられる場合は「○」を，拒絶されると考えられる場合は「×」を，選びなさい。", "opts": [{"k": "○", "t": ""}, {"k": "×", "t": ""}], "neg": false, "topic": "特許", "exp": "外国（米国）での販売も公知・公然実施にあたり、新規性を失わせます。出願日より前の乙の販売があるので、出願Pは拒絶されます。"}, {"id": "53j2", "exam": 53, "part": "実技", "no": 2, "ans": "ウ", "ctx": "甲は独自に創作した機能的な事務用椅子の形状に関する発明Aについて，2025年11月10日に特許出願Pをした。一方，乙は独自に創作した発明Aと同じ発明に係る事務用椅子について，2025年9月1日に米国国内の乙の店舗のみにおいて販売を開始した。また，丙は独自に創作した発明Aと同じ発明について，2025年4月1日に特許出願Qをするとともに，出願時に早期審査を申請した後に登録され，2025年11月20日に特許掲載公報が発行された。", "type": "choice", "stem": "【理由群Ⅰ】の中から，問1において拒絶されない又は拒絶されると判断した理由として，最も適切と考えられるものを1つ選びなさい。", "opts": [{"k": "ア", "t": "乙の行為は販売行為であり，特許出願Pに係る発明は新規性を喪失しないため"}, {"k": "イ", "t": "乙の行為は外国の特定の場所のみにおける行為であり，特許出願Pに係る発明は新規性を喪失しないため"}, {"k": "ウ", "t": "乙の行為により，特許出願Pに係る発明は新規性を喪失するため"}], "neg": false, "topic": "特許", "exp": "理由はウ。新規性の判断は世界基準で、外国の店舗での販売も新規性喪失の原因です。"}, {"id": "53j3", "exam": 53, "part": "実技", "no": 3, "ans": "×", "ctx": "甲は独自に創作した機能的な事務用椅子の形状に関する発明Aについて，2025年11月10日に特許出願Pをした。一方，乙は独自に創作した発明Aと同じ発明に係る事務用椅子について，2025年9月1日に米国国内の乙の店舗のみにおいて販売を開始した。また，丙は独自に創作した発明Aと同じ発明について，2025年4月1日に特許出願Qをするとともに，出願時に早期審査を申請した後に登録され，2025年11月20日に特許掲載公報が発行された。", "type": "maru", "stem": "特許出願Pについて，丙の行為により，拒絶されないと考えられる場合は「○」を，拒絶されると考えられる場合は「×」を，選びなさい。", "opts": [{"k": "○", "t": ""}, {"k": "×", "t": ""}], "neg": false, "topic": "特許", "exp": "丙の出願Qは甲の出願Pより先で、同一の発明なので先願の地位を持ち、出願Pは拒絶されます。"}, {"id": "53j4", "exam": 53, "part": "実技", "no": 4, "ans": "イ", "ctx": "甲は独自に創作した機能的な事務用椅子の形状に関する発明Aについて，2025年11月10日に特許出願Pをした。一方，乙は独自に創作した発明Aと同じ発明に係る事務用椅子について，2025年9月1日に米国国内の乙の店舗のみにおいて販売を開始した。また，丙は独自に創作した発明Aと同じ発明について，2025年4月1日に特許出願Qをするとともに，出願時に早期審査を申請した後に登録され，2025年11月20日に特許掲載公報が発行された。", "type": "choice", "stem": "【理由群Ⅱ】の中から，問3において拒絶されない又は拒絶されると判断した理由として，最も適切と考えられるものを1つ選びなさい。", "opts": [{"k": "ア", "t": "特許出願Pに対して，特許出願Qは拡大された先願の地位を有さないため"}, {"k": "イ", "t": "特許出願Pに対して，特許出願Qは先願の地位を有するため"}, {"k": "ウ", "t": "特許出願Qにより，特許出願Pに係る発明は新規性を喪失するため"}], "neg": false, "topic": "特許", "exp": "理由はイ。先に出願した丙の出願Qが先願の地位を有します。"}, {"id": "53j5", "exam": 53, "part": "実技", "no": 5, "ans": "×", "ctx": "人気の漫画家甲が描いた漫画Aの原画を，乙は甲から直接購入した。そのことを知った丙は乙に，漫画Aの原画を，丙が主催する漫画教室の壁に掛けて生徒に見せたいと申し入れ，乙の同意を得た。丙は，発言1～2をしている。\n発言1 「この漫画教室で，漫画Aの原画を印刷した鑑賞用の豪華なカタログを，50000円で販売したいと思います。漫画Aの原画を印刷するにあたっては，原画の所有者である乙から許諾を得れば足り，甲の許諾を得る必要はありませんね。」\n発言2 「この漫画教室は有料なので，漫画Aの原画を壁に掛けて生徒に見せるためには，甲の許諾を得る必要がありますね。」", "type": "maru", "stem": "発言1について，適切と考えられる場合は「○」を，不適切と考えられる場合は「×」を，選びなさい。", "opts": [{"k": "○", "t": ""}, {"k": "×", "t": ""}], "neg": false, "topic": "著作権", "exp": "絵の原画の所有者（乙）の許諾だけでは足りません。原画を印刷するのは複製なので、著作権者（甲）の許諾が必要です。"}, {"id": "53j6", "exam": 53, "part": "実技", "no": 6, "ans": "イ", "ctx": "人気の漫画家甲が描いた漫画Aの原画を，乙は甲から直接購入した。そのことを知った丙は乙に，漫画Aの原画を，丙が主催する漫画教室の壁に掛けて生徒に見せたいと申し入れ，乙の同意を得た。丙は，発言1～2をしている。\n発言1 「この漫画教室で，漫画Aの原画を印刷した鑑賞用の豪華なカタログを，50000円で販売したいと思います。漫画Aの原画を印刷するにあたっては，原画の所有者である乙から許諾を得れば足り，甲の許諾を得る必要はありませんね。」\n発言2 「この漫画教室は有料なので，漫画Aの原画を壁に掛けて生徒に見せるためには，甲の許諾を得る必要がありますね。」", "type": "choice", "stem": "【理由群Ⅲ】の中から，問5において適切又は不適切と判断した理由として，最も適切と考えられるものを1つ選びなさい。", "opts": [{"k": "ア", "t": "許諾を得なければ展示権の侵害となるため"}, {"k": "イ", "t": "許諾を得なければ複製権の侵害となるため"}, {"k": "ウ", "t": "著作権は生じているが，その権利が制限されるため"}], "neg": false, "topic": "著作権", "exp": "理由はイ。許諾なしの印刷は複製権の侵害です。"}, {"id": "53j7", "exam": 53, "part": "実技", "no": 7, "ans": "×", "ctx": "人気の漫画家甲が描いた漫画Aの原画を，乙は甲から直接購入した。そのことを知った丙は乙に，漫画Aの原画を，丙が主催する漫画教室の壁に掛けて生徒に見せたいと申し入れ，乙の同意を得た。丙は，発言1～2をしている。\n発言1 「この漫画教室で，漫画Aの原画を印刷した鑑賞用の豪華なカタログを，50000円で販売したいと思います。漫画Aの原画を印刷するにあたっては，原画の所有者である乙から許諾を得れば足り，甲の許諾を得る必要はありませんね。」\n発言2 「この漫画教室は有料なので，漫画Aの原画を壁に掛けて生徒に見せるためには，甲の許諾を得る必要がありますね。」", "type": "maru", "stem": "発言2について，適切と考えられる場合は「○」を，不適切と考えられる場合は「×」を，選びなさい。", "opts": [{"k": "○", "t": ""}, {"k": "×", "t": ""}], "neg": false, "topic": "著作権", "exp": "美術の著作物の原作品は、所有者の同意があれば展示できます。有料の教室でも著作権者の許諾は不要なので、発言2は不適切です。"}, {"id": "53j8", "exam": 53, "part": "実技", "no": 8, "ans": "ウ", "ctx": "人気の漫画家甲が描いた漫画Aの原画を，乙は甲から直接購入した。そのことを知った丙は乙に，漫画Aの原画を，丙が主催する漫画教室の壁に掛けて生徒に見せたいと申し入れ，乙の同意を得た。丙は，発言1～2をしている。\n発言1 「この漫画教室で，漫画Aの原画を印刷した鑑賞用の豪華なカタログを，50000円で販売したいと思います。漫画Aの原画を印刷するにあたっては，原画の所有者である乙から許諾を得れば足り，甲の許諾を得る必要はありませんね。」\n発言2 「この漫画教室は有料なので，漫画Aの原画を壁に掛けて生徒に見せるためには，甲の許諾を得る必要がありますね。」", "type": "choice", "stem": "【理由群Ⅳ】の中から，問7において適切又は不適切と判断した理由として，最も適切と考えられるものを1つ選びなさい。", "opts": [{"k": "ア", "t": "許諾を得なければ上演権の侵害となるため"}, {"k": "イ", "t": "許諾を得なければ貸与権の侵害となるため"}, {"k": "ウ", "t": "許諾を得なくても著作権の侵害とならないため"}], "neg": false, "topic": "著作権", "exp": "理由はウ。原作品の展示は所有者に認められており、著作権の侵害になりません。"}, {"id": "53j9", "exam": 53, "part": "実技", "no": 9, "ans": "ア", "type": "choice", "stem": "自動車メーカーX社の知的財産部の部員は，特許協力条約（PCT）に基づく国際出願をすることを検討している。ア～ウを比較して，部員の考えとして，最も不適切と考えられるものを1つ選びなさい。", "opts": [{"k": "ア", "t": "国際出願した後，所定の期間内に国際調査機関に対して国際調査を行うことを請求する必要がある。"}, {"k": "イ", "t": "国際出願した後，原則として優先日から18カ月経過後に国際公開が行われるが，国際公開の時期を早めることもできる。"}, {"k": "ウ", "t": "国際出願した後，所定の期間内に指定国毎に国内移行手続を行うために，国際事務局に対して移行手続の請求を行う必要はない。"}], "neg": true, "topic": "条約", "exp": "PCTでは国際調査の請求は不要で、国際出願をすれば自動的に行われます。アが誤りです。"}, {"id": "53j10", "exam": 53, "part": "実技", "no": 10, "ans": "イ", "type": "choice", "stem": "鞄メーカーX社は，新商品である折り畳み可能なカードケースAを販売しようとしている。ア～ウを比較して，X社の意匠登録出願に関して，最も不適切と考えられるものを1つ選びなさい。", "opts": [{"k": "ア", "t": "カードケースAは，開いた形状及び折り畳んだ形状に特徴があり，開いた形状を表す図面と，折り畳んだ形状を表す図面の両方を用いて，一の意匠登録出願をすることができる。"}, {"k": "イ", "t": "カードケースAは，留め具の部分に特徴があるが，留め具の部分について意匠登録出願をすることはできない。"}, {"k": "ウ", "t": "カードケースAについて，意匠登録出願をし，意匠登録を受けた場合に，発売時期を考慮して，登録料の納付と同時に，秘密請求をすることができる。"}], "neg": true, "topic": "意匠", "exp": "部分意匠として、留め具の部分だけで意匠登録出願できます。イの「できない」が誤りです。"}, {"id": "53j11", "exam": 53, "part": "実技", "no": 11, "ans": "ウ", "type": "choice", "stem": "生活用品メーカーX社では，スプーンの持ち手である柄aについて特許権P，及び商品名bについて指定商品をスプーンとする商標権Mを有している。ア～ウを比較して，最も不適切と考えられるものを1つ選びなさい。ただし，スプーンとフォークは類似する商品とし，また，柄aに係る発明「柄」は，スプーン，フォーク及びナイフに使用可能である。", "opts": [{"k": "ア", "t": "X社と競合するY社が，柄aを用いたフォークを製造販売する行為は，特許権Pの侵害となる。"}, {"k": "イ", "t": "X社が，柄aを用いたナイフを製造販売する行為は，特許権Pに係る特許発明の実施に該当する。"}, {"k": "ウ", "t": "X社が，スプーンとセットで使用するフォークに商品名bを付して製造販売する行為は，商標権Mに係る登録商標の使用に該当する。"}], "neg": true, "topic": "商標", "exp": "フォークはスプーンの類似商品なので、商品名bをフォークに付すのは商標権の禁止権の範囲です。ただし、登録商標の「使用」は指定商品（スプーン）について行うものです。"}, {"id": "53j12", "exam": 53, "part": "実技", "no": 12, "ans": "イ", "type": "choice", "stem": "機械メーカーX社の冷却装置に関する特許出願Pについて，発明者甲が，知的財産部の部員乙に出願審査請求について相談している。ア～ウを比較して，乙の発言として，最も適切と考えられるものを1つ選びなさい。", "opts": [{"k": "ア", "t": "甲 「特許出願Pを早く権利化したいので，すぐに出願審査請求をしてください。」\n乙 「特許出願Pは出願から半年経過した状態で非公開なので，出願審査請求をすることはできません。」"}, {"k": "イ", "t": "甲 「特許出願Pを早く権利化したいので，とりあえず出願審査請求し，問題があれば出願審査請求をキャンセルしてください。」\n乙 「一度手続した出願審査請求を取り下げることはできないので，キャンセルはできません。」"}, {"k": "ウ", "t": "甲 「特許出願Pを早く権利化したいので，他の出願より早く審査をしてもらってください。」\n乙 「特許庁は公平に職務を遂行する義務があるので，他の出願より早く審査をしてもらうことはできません。」"}], "neg": false, "topic": "特許", "exp": "審査請求は取り下げられません。審査請求は出願公開前でもでき、早期審査の申請制度もあります。"}, {"id": "53j13", "exam": 53, "part": "実技", "no": 13, "ans": "イ", "type": "choice", "stem": "作曲家甲は1999年11月1日に楽曲Aを作曲し，2000年1月1日のコンサートで楽曲Aを演奏した。その後，甲は2024年6月1日に死亡した。ア～ウを比較して，当該演奏の著作隣接権が満了する年月日として，最も適切と考えられるものを1つ選びなさい。", "opts": [{"k": "ア", "t": "2069年12月31日"}, {"k": "イ", "t": "2070年12月31日"}, {"k": "ウ", "t": "2094年12月31日"}], "neg": false, "topic": "著作権", "exp": "演奏の著作隣接権（実演家の権利）は、演奏した年の翌年から70年で、2070年12月31日です。作曲家の死亡は関係ありません。"}, {"id": "53j14", "exam": 53, "part": "実技", "no": 14, "ans": "ウ", "type": "choice", "stem": "家電メーカーX社は，新商品として家庭用冷蔵庫を開発し，この新商品の商品名を検討している。商品名として，営業部から名称A，名称Bが提案された。ア～ウを比較して，X社の知的財産部の部員の考えとして，最も不適切と考えられるものを1つ選びなさい。ただし，名称Aと名称Bは，類似するものとする。", "opts": [{"k": "ア", "t": "名称Bについては，家庭用冷蔵庫に類似する商品である家庭用電子レンジも一の商標登録出願の指定商品に含めて出願する。"}, {"k": "イ", "t": "名称Aについて商標登録を受けるためには，出願前に名称Aを使用していること又は少なくとも使用意思を有することが必要である。"}, {"k": "ウ", "t": "名称Aと名称Bとは類似するので，商標登録を受けるためには，同日に商標登録出願をしなければならない。"}], "neg": true, "topic": "商標", "exp": "類似する商標を異なる日に出願しても、先に出願した方が優先されるだけで、同日出願が条件ではありません。ウが誤りです。"}, {"id": "53j15", "exam": 53, "part": "実技", "no": 15, "ans": "ア", "type": "choice", "stem": "イチゴの品種Aの育成者甲は，今月中に品種Aについて種苗法に基づく品種登録出願をしようと考え，友人乙に相談した。ア～ウを比較して，乙の発言として，最も不適切と考えられるものを1つ選びなさい。", "opts": [{"k": "ア", "t": "「品種Aはこの分野の通常の知識を有する者であれば容易に育成することができるので，品種登録を受けることはできません。」"}, {"k": "イ", "t": "「甲は半年前から品種Aを日本国内で継続的に販売していますが，品種登録を受けることはできます。」"}, {"k": "ウ", "t": "「品種Aは公然知られた他の品種Bと特性の全部又は一部によって明確に区別することができないので，品種登録を受けることはできません。」"}], "neg": true, "topic": "種苗", "exp": "品種登録の要件は区別性・均一性・安定性・未譲渡性などで、育成の容易さは要件ではありません。国内での譲渡は、出願の1年以内なら登録できます。"}, {"id": "53j16", "exam": 53, "part": "実技", "no": 16, "ans": "ウ", "type": "choice", "stem": "X社は，格子形状であるテニス用ネットについて意匠権Dを有している。ア～ウを比較して，X社の意匠権Dを侵害しない行為として，最も適切と考えられるものを1つ選びなさい。ただし，格子形状を形状Aとし，形状Aと形状Bは類似する形状であり，テニス用ネットと網戸は類似しない物品であるとする。", "opts": [{"k": "ア", "t": "Y社が形状Bと同一形状のテニス用ネットを製造する行為"}, {"k": "イ", "t": "V社が形状Bと同一形状のテニス用ネットを輸出する行為"}, {"k": "ウ", "t": "W社が形状Aと同一形状の網戸を販売する行為"}], "neg": false, "topic": "意匠", "exp": "形状Aを網戸に使っても、テニス用ネットと網戸は非類似の物品なので、意匠権の侵害になりません。輸出も実施にあたります。"}, {"id": "53j17", "exam": 53, "part": "実技", "no": 17, "ans": "ア", "type": "choice", "stem": "ア～ウを比較して，特許を受けることができる発明として，最も適切と考えられるものを1つ選びなさい。", "opts": [{"k": "ア", "t": "スマートフォンのデータの記録方法"}, {"k": "イ", "t": "ラグビーのフットワークの方法"}, {"k": "ウ", "t": "クラウドサービスの定額制料金の支払方法"}], "neg": false, "topic": "特許", "exp": "スマホのデータの記録方法は技術的な発明です。スポーツの動きや料金の支払方法は、自然法則を利用しておらず、発明ではありません。"}, {"id": "53j18", "exam": 53, "part": "実技", "no": 18, "ans": "イ", "type": "choice", "stem": "ア～ウを比較して，商標登録出願に関して，最も不適切と考えられるものを1つ選びなさい。", "opts": [{"k": "ア", "t": "商標登録出願に係る商標を「ウスターソース」とし，指定商品を「しょうゆ」として，商標登録出願をした場合には，登録を受けることができない。"}, {"k": "イ", "t": "商標登録出願に係る商標を「正宗」とし，指定商品を「清酒」として，商標登録出願をした場合には，登録を受けることができる。"}, {"k": "ウ", "t": "商標登録出願に係る商標を「洋菓子」とし，指定商品を「カステラ」として，商標登録出願をした場合には，登録を受けることができない。"}], "neg": true, "topic": "商標", "exp": "「正宗」は清酒で慣用されている商標なので登録できません。ウスターソースをしょうゆに使うのも、洋菓子をカステラに使うのも登録できません。"}, {"id": "53j19", "exam": 53, "part": "実技", "no": 19, "ans": "ウ", "type": "choice", "stem": "X社は，中国にした特許出願Pに基づいてパリ条約上の優先権の主張をして，わが国に特許出願Qをした。ところが，特許出願Qについて出願審査請求をする前に，特許出願Pが拒絶された。ア～ウを比較して，X社の知的財産部の部員の考えとして，最も適切と考えられるものを1つ選びなさい。", "opts": [{"k": "ア", "t": "特許出願Pが拒絶された場合，そのことを理由として特許出願Qも当然に拒絶されるので，出願審査請求をする必要はない。"}, {"k": "イ", "t": "特許出願Pが拒絶されると，優先権の主張は無効となり，特許出願Qのわが国における出願日を基準として審査が行われる。したがって，新たな先行技術がないかどうかを含めてよく検討した上で出願審査請求の要否を決めればよい。"}, {"k": "ウ", "t": "特許出願Pが拒絶されても，特許出願Qが当然に拒絶されるとは考えられない。したがって，特許出願Pが拒絶された理由を十分に検討した上で出願審査請求の要否を決めればよい。"}], "neg": false, "topic": "条約", "exp": "各国の特許は独立しています。最初の出願が拒絶されても、優先権を主張した出願が当然に拒絶されるわけではありません。"}, {"id": "53j20", "exam": 53, "part": "実技", "no": 20, "ans": "イ", "type": "choice", "stem": "甲と乙は，共同で作詞及び作曲を行い，音楽Aを創作した。ア～ウを比較して，最も不適切と考えられるものを1つ選びなさい。", "opts": [{"k": "ア", "t": "丙は，甲及び乙に無断で音楽Aをインターネット上で無料でダウンロード可能としている。甲及び乙は，丙に対して差止請求をするとともに，損害賠償請求をすることができる。"}, {"k": "イ", "t": "甲は丁から，音楽Aを演奏することについて許諾を求められた。甲は，単独で丁に許諾をすることができる。"}, {"k": "ウ", "t": "戊が音楽Aの歌詞の一部を変えて演奏及び歌っている動画が話題となっている。甲及び乙は，戊に対して名誉回復等の措置の請求をすることができる場合がある。"}], "neg": true, "topic": "著作権", "exp": "共同著作物の著作権は共有で、許諾には全員の合意が必要です。甲が単独で丁に許諾することはできません。"}, {"id": "53j21", "exam": 53, "part": "実技", "no": 21, "ans": "ウ", "type": "choice", "stem": "医療機器メーカーX社の知的財産部の部員は，X社が有している特許権Pについて他社製品の調査を行った。その結果，競合メーカーY社が製造販売する製品Aが，X社の特許権Pを侵害している可能性が高いことを発見した。ア～ウを比較して，X社の部員の考えとして，最も不適切と考えられるものを1つ選びなさい。", "opts": [{"k": "ア", "t": "特許権Pが無効にされるとY社に権利行使できなくなるので，特許情報プラットフォーム（J-PlatPat）等を使って調査を行い，特許権Pに無効理由がないことを確認する。"}, {"k": "イ", "t": "Y社は特許権Pの存在を知らない可能性があり，侵害行為を止めさせるために，Y社に対して警告書を送付する。"}, {"k": "ウ", "t": "特許権Pの侵害を警告されたY社は，製品Aが特許権Pに係る特許発明の技術的範囲に属していないことを確認するために，特許庁に判定を請求することができるが，特許権者であるX社は，判定を請求することはできない。"}], "neg": true, "topic": "特許", "exp": "特許発明の技術的範囲の判定は、特許権者も請求できます。"}, {"id": "53j22", "exam": 53, "part": "実技", "no": 22, "ans": "イ", "type": "choice", "stem": "総合電機メーカーX社の技術者甲は，業務の一環として新しい画像処理技術である発明Aを創作した。甲は発明AをX社へ届出をし，X社は発明Aを特許出願した。X社には職務発明に関する規程があり，「従業者が職務上行った発明に係る特許を受ける権利は，その発生時点から会社に帰属する」と定められている。ア～ウを比較して，最も適切と考えられるものを1つ選びなさい。", "opts": [{"k": "ア", "t": "X社が特許を受ける権利を有するので，甲は発明者になり得ない。"}, {"k": "イ", "t": "X社から職務発明の対価として，甲は相当の経済上の利益を受けることができる。"}, {"k": "ウ", "t": "X社は特許を受ける権利を有し，甲は発明Aについて法定通常実施権を有する。"}], "neg": false, "topic": "特許", "exp": "職務発明で会社が権利を取得すると、従業者（甲）は相当の経済上の利益を受ける権利を持ちます。発明者はあくまで甲です。"}, {"id": "53j23", "exam": 53, "part": "実技", "no": 23, "ans": "ウ", "type": "choice", "stem": "出版社X社の営業部の部員甲と法務部の部員乙が，著作者について会話をしている。ア～ウを比較して，最も適切と考えられるものを1つ選びなさい。", "opts": [{"k": "ア", "t": "甲 「わが社の総務部の部員丙が趣味で撮影した写真が素晴らしいので，わが社のポスターに使用したいと思います。この場合，写真の著作者は誰になりますか。」\n乙 「わが社の社員が作成したものであれば職務著作が成立するので，わが社と丙が著作者となります。」"}, {"k": "イ", "t": "甲 「わが社のキャラクターを作ることになり，デザイン会社Y社にキャラクターデザインの制作を依頼しました。Y社からキャラクター案が届き，社内で検討の後に採用となりました。このキャラクター案に描かれているキャラクターの絵柄の著作者は誰になりますか。」\n乙 「キャラクターデザインの制作を依頼し，このキャラクターを今後使用することになるわが社が，著作者となります。」"}, {"k": "ウ", "t": "甲 「わが社が出版する小説が今度，映画化されることになりました。この場合，映画の著作物の著作者は誰になりますか。」\n乙 「その映画のプロデューサー，映画監督等，すなわちその映画の全体的形成に創作的に寄与した者が著作者になります。」"}], "neg": false, "topic": "著作権", "exp": "映画の著作物の著作者は、映画の全体的形成に創作的に寄与した者（監督・プロデューサー等）です。趣味で撮った写真の著作者は丙で、委託したキャラクターの著作者はY社です。"}, {"id": "53j24", "exam": 53, "part": "実技", "no": 24, "ans": "ア", "type": "choice", "stem": "オンラインでの食品等の販売事業を計画しているX社では，自社の商品販売用サイトを，自社で作成するか又はウェブサイト制作会社のY社に作成を依頼するかについて検討している。ア～ウを比較して，X社の従業員の考えとして，最も不適切と考えられるものを1つ選びなさい。", "opts": [{"k": "ア", "t": "Y社と著作者人格権と著作権の譲渡について合意した上で，商品販売用サイトの作成の業務を委託すれば，わが社の従業員は商品販売用サイトにおける商品の説明文を自由に変更することができる。"}, {"k": "イ", "t": "商品販売用サイトに係る著作権をわが社に移転することを合意してY社に商品販売用サイトの作成を依頼した場合でも，商品販売用サイトの著作者はY社になるから，わが社の従業員が商品販売用サイトにおける商品の説明文を自由に変更するためには，著作者人格権に関する合意も必要となる。"}, {"k": "ウ", "t": "ウェブサイトの作成の技術を有するわが社の従業員が職務として商品販売用サイトを作成すれば，その商品販売用サイトの著作者はわが社になるから，わが社の他の従業員は商品販売用サイトにおける商品の説明文を自由に変更することができる。"}], "neg": true, "topic": "著作権", "exp": "著作者人格権は譲渡できません。サイトを自由に改変するには、人格権の不行使の合意などが必要です。アの「人格権の譲渡について合意」が誤りです。"}, {"id": "53j25", "exam": 53, "part": "実技", "no": 25, "ans": "ア", "type": "choice", "stem": "会計ソフトウェアを開発するX社は，新しく開発したプログラムについて，著作権の登録制度を利用することを検討している。ア～ウを比較して，X社の法務部の部員の考えとして，最も適切と考えられるものを1つ選びなさい。", "opts": [{"k": "ア", "t": "創作年月日の登録を行うことにより，その登録の日に創作があったものと推定される。"}, {"k": "イ", "t": "著作権の登録を受けることにより，第三者の著作権侵害に対して損害賠償請求をする場合に，損害額の推定規定の適用を受けることができる。"}, {"k": "ウ", "t": "著作権の登録を受けることにより，その登録の日に著作権が発生したものとみなされる。"}], "neg": false, "topic": "著作権", "exp": "創作年月日の登録をすると、登録された年月日に創作があったと推定されます。著作権は登録しなくても発生し、損害額の推定にも関係しません。"}, {"id": "53j26", "exam": 53, "part": "実技", "no": 26, "ans": "ウ", "type": "choice", "stem": "ア～ウを比較して，意匠法上の保護対象として，最も不適切と考えられるものを1つ選びなさい。", "opts": [{"k": "ア", "t": "鼻緒"}, {"k": "イ", "t": "糸"}, {"k": "ウ", "t": "片栗粉"}], "neg": true, "topic": "意匠", "exp": "粉状・粒状のように形が定まらないもの（片栗粉）は、意匠法の「物品」に当たりません。糸や鼻緒は物品です。"}, {"id": "53j27", "exam": 53, "part": "実技", "no": 27, "ans": "170000", "type": "num", "stem": "日本を代表する大手自動車メーカーX社は，自動運転装置に関する発明について，請求項の数を8とする特許出願Pについて，2026年1月20日に出願し，その後，出願審査請求することについて検討している。この場合，出願審査請求のためにX社が必要な費用は何円か，記入例に従って算用数字で記入しなさい。\n記入例 50000円の場合は，左詰めで「50000」と記入\n特許法第195条関係別表及び特許法等関係手数料令より抜粋\n納付しなければならない者 金額\n特許出願をする者 1件につき14000円\n出願審査の請求をする者 1件につき138000円に1請求項につき4000円を加えた額", "opts": [], "neg": false, "topic": "特許", "exp": "審査請求の費用は、138,000円＋4,000円×請求項8＝170,000円です。特許出願の14,000円は含みません。"}, {"id": "53j28", "exam": 53, "part": "実技", "no": 28, "ans": "カ", "type": "choice", "ctx": "次の会話は，X社の知的財産部の部員甲と乙が，Y社から受けた商標権の侵害の警告書へのX社の今後の対応について，検討しているものである。問28～問30に答えなさい。\n乙 「警告書はどのような内容でしたか。」\n甲 「製品の製造販売の中止を求める内容でした。したがって，差止請求を免れることができるかどうかを検討する必要があります。」\n乙 「具体的には，どういうことですか。」\n甲 「例えば，商標登録が，商標法第4条第1項第11号に違反して登録された場合には，商標登録の ［1］ 審判を請求する措置をとることができます。」\n乙 「誰が ［1］ 審判を請求できますか。」\n甲 「 ［2］ 請求することができます。」\n乙 「いつでも ［1］ 審判を請求できますか。」\n甲 「商標権の設定登録日から ［3］ を経過すると請求できなくなる場合もあるので注意する必要があります。」", "stem": "【語群Ⅴ】の中から空欄［1］に入る語句として最も適切と考えられるものを1つ選びなさい。", "opts": [{"k": "ア", "t": "1年"}, {"k": "イ", "t": "出願人に限り"}, {"k": "ウ", "t": "取消"}, {"k": "エ", "t": "5年"}, {"k": "オ", "t": "何人でも"}, {"k": "カ", "t": "無効"}, {"k": "キ", "t": "10年"}, {"k": "ク", "t": "利害関係人に限り"}], "neg": false, "topic": "商標", "exp": "他人の先願商標に類似する登録（4条1項11号違反）は、取消しではなく「無効」審判で争います。"}, {"id": "53j29", "exam": 53, "part": "実技", "no": 29, "ans": "ク", "type": "choice", "ctx": "次の会話は，X社の知的財産部の部員甲と乙が，Y社から受けた商標権の侵害の警告書へのX社の今後の対応について，検討しているものである。問28～問30に答えなさい。\n乙 「警告書はどのような内容でしたか。」\n甲 「製品の製造販売の中止を求める内容でした。したがって，差止請求を免れることができるかどうかを検討する必要があります。」\n乙 「具体的には，どういうことですか。」\n甲 「例えば，商標登録が，商標法第4条第1項第11号に違反して登録された場合には，商標登録の ［1］ 審判を請求する措置をとることができます。」\n乙 「誰が ［1］ 審判を請求できますか。」\n甲 「 ［2］ 請求することができます。」\n乙 「いつでも ［1］ 審判を請求できますか。」\n甲 「商標権の設定登録日から ［3］ を経過すると請求できなくなる場合もあるので注意する必要があります。」", "stem": "【語群Ⅴ】の中から空欄［2］に入る語句として最も適切と考えられるものを1つ選びなさい。", "opts": [{"k": "ア", "t": "1年"}, {"k": "イ", "t": "出願人に限り"}, {"k": "ウ", "t": "取消"}, {"k": "エ", "t": "5年"}, {"k": "オ", "t": "何人でも"}, {"k": "カ", "t": "無効"}, {"k": "キ", "t": "10年"}, {"k": "ク", "t": "利害関係人に限り"}], "neg": false, "topic": "商標", "exp": "この無効審判は、利害関係人に限り請求できます。"}, {"id": "53j30", "exam": 53, "part": "実技", "no": 30, "ans": "エ", "type": "choice", "ctx": "次の会話は，X社の知的財産部の部員甲と乙が，Y社から受けた商標権の侵害の警告書へのX社の今後の対応について，検討しているものである。問28～問30に答えなさい。\n乙 「警告書はどのような内容でしたか。」\n甲 「製品の製造販売の中止を求める内容でした。したがって，差止請求を免れることができるかどうかを検討する必要があります。」\n乙 「具体的には，どういうことですか。」\n甲 「例えば，商標登録が，商標法第4条第1項第11号に違反して登録された場合には，商標登録の ［1］ 審判を請求する措置をとることができます。」\n乙 「誰が ［1］ 審判を請求できますか。」\n甲 「 ［2］ 請求することができます。」\n乙 「いつでも ［1］ 審判を請求できますか。」\n甲 「商標権の設定登録日から ［3］ を経過すると請求できなくなる場合もあるので注意する必要があります。」", "stem": "【語群Ⅴ】の中から空欄［3］に入る語句として最も適切と考えられるものを1つ選びなさい。", "opts": [{"k": "ア", "t": "1年"}, {"k": "イ", "t": "出願人に限り"}, {"k": "ウ", "t": "取消"}, {"k": "エ", "t": "5年"}, {"k": "オ", "t": "何人でも"}, {"k": "カ", "t": "無効"}, {"k": "キ", "t": "10年"}, {"k": "ク", "t": "利害関係人に限り"}], "neg": false, "topic": "商標", "exp": "この無効審判は、設定登録日から5年を経過すると請求できなくなります。"}, {"id": "52g1", "exam": 52, "part": "学科", "no": 1, "ans": "ア", "type": "choice", "stem": "ア～ウを比較して，商標登録を受けられる商標に関して，最も不適切と考えられるものはどれか。", "opts": [{"k": "ア", "t": "先に出願された自己の登録商標と類似する商標について，商標登録を受けることができない。"}, {"k": "イ", "t": "商品の機能を確保するために不可欠な立体的形状のみからなる商標について，商標登録を受けることができない。"}, {"k": "ウ", "t": "他人の著名な芸名を含む商標は，その他人の承諾を得れば，商標登録を受けることができる。"}], "neg": true, "topic": "商標", "exp": "自己の先願の登録商標に類似する商標でも、登録を受けられます。アの「受けることができない」が誤りです。他人の著名な芸名は、承諾があれば登録できます。"}, {"id": "52g2", "exam": 52, "part": "学科", "no": 2, "ans": "ウ", "type": "choice", "stem": "ア～ウを比較して，特許出願における拒絶査定不服審判の請求と同時に行うことができる手続として，最も不適切と考えられるものはどれか。", "opts": [{"k": "ア", "t": "特許出願の分割を行う"}, {"k": "イ", "t": "手続補正書を提出する"}, {"k": "ウ", "t": "拒絶審決に対する訴えを提起する"}], "neg": true, "topic": "特許", "exp": "拒絶査定不服審判と同時にできるのは、手続補正と出願の分割です。審決取消訴訟は、審決が出た後に起こすものです。"}, {"id": "52g3", "exam": 52, "part": "学科", "no": 3, "ans": "イ", "type": "choice", "stem": "ア～ウを比較して，著作権法上の引用に関して，最も適切と考えられるものはどれか。", "opts": [{"k": "ア", "t": "他人の著作物を引用して複製する場合，公正な慣行に合致するものであれば，引用箇所を明確に区別する必要はない。"}, {"k": "イ", "t": "他人の著作物を引用して複製する場合，その複製の態様に応じ合理的と認められる方法及び程度で，その著作物の出所を明示する。"}, {"k": "ウ", "t": "他人の著作物を引用して複製する場合，引用する側が従，引用される側が主とならなければならない。"}], "neg": false, "topic": "著作権", "exp": "引用では、引用箇所を明確に区別し、出所を合理的な方法で明示します。引用する側が従、される側が主という関係が必要です。"}, {"id": "52g4", "exam": 52, "part": "学科", "no": 4, "ans": "ウ", "type": "choice", "stem": "ア～ウを比較して，特許協力条約（PCT）に基づく国際出願の国際出願日として認められる日として，最も適切と考えられるものはどれか。", "opts": [{"k": "ア", "t": "指定国の特許庁において，国内移行手続を開始した日"}, {"k": "イ", "t": "国際事務局が，国際調査報告を受理した日"}, {"k": "ウ", "t": "受理官庁が，国際出願を受理した日"}], "neg": false, "topic": "条約", "exp": "国際出願日は、受理官庁が国際出願を受理した日です。"}, {"id": "52g5", "exam": 52, "part": "学科", "no": 5, "ans": "イ", "type": "choice", "stem": "ア～ウを比較して，商標登録等に関して，最も適切と考えられるものはどれか。", "opts": [{"k": "ア", "t": "特定農林水産物等の名称の保護に関する法律に基づいて商標の保護を受けるためには，特許庁に出願しなければならない。"}, {"k": "イ", "t": "音商標，位置商標，動き商標について商標登録を受けることができる。"}, {"k": "ウ", "t": "特許庁長官は，商標登録出願の日から6カ月を経過したときは，その商標登録出願について出願公開をしなければならない。"}], "neg": false, "topic": "商標", "exp": "音商標・位置商標・動き商標も商標登録できます（新しいタイプの商標）。地理的表示の保護は農林水産省の登録制度で、特許庁への出願ではありません。"}, {"id": "52g6", "exam": 52, "part": "学科", "no": 6, "ans": "イ", "type": "choice", "stem": "ア～ウを比較して，著作物に関して，最も不適切と考えられるものはどれか。", "opts": [{"k": "ア", "t": "著作物とは，思想又は感情を創作的に表現したものであって，文芸，学術，美術又は音楽の範囲に属するものをいう。"}, {"k": "イ", "t": "保護される著作物は，著作権法に限定列挙されている。"}, {"k": "ウ", "t": "二次的著作物とは，著作物を翻訳し，編曲し，若しくは変形し，又は脚色し，映画化し，その他翻案することにより創作した著作物をいう。"}], "neg": true, "topic": "著作権", "exp": "保護される著作物の種類は例示で、限定列挙ではありません。"}, {"id": "52g7", "exam": 52, "part": "学科", "no": 7, "ans": "イ", "type": "choice", "stem": "ア～ウを比較して，特許出願の明細書の記載事項として，最も適切と考えられるものはどれか。", "opts": [{"k": "ア", "t": "発明の名称，発明の要約，特許請求の範囲"}, {"k": "イ", "t": "発明の名称，図面の簡単な説明，発明の詳細な説明"}, {"k": "ウ", "t": "図面の簡単な説明，図面，発明の要約"}], "neg": false, "topic": "特許", "exp": "明細書には、発明の名称・図面の簡単な説明・発明の詳細な説明を書きます。特許請求の範囲と要約書は別の書類です。"}, {"id": "52g8", "exam": 52, "part": "学科", "no": 8, "ans": "ウ", "type": "choice", "stem": "ア～ウを比較して，特許権に係る通常実施権の許諾契約に関して，最も不適切と考えられるものはどれか。", "opts": [{"k": "ア", "t": "特許権が共有に係る場合，一の共有者が他人と通常実施権の許諾契約を締結するためには，他の共有者の同意が必要となる。"}, {"k": "イ", "t": "特許権者は，同一の特許権について，競合する複数人に対して通常実施権を許諾することができる。"}, {"k": "ウ", "t": "通常実施権の許諾契約において，その通常実施権者以外の者に対して通常実施権を許諾しない旨の特約を伴う契約をすることはできない。"}], "neg": true, "topic": "特許", "exp": "特許権者は、「他に通常実施権を許諾しない」という特約付きの契約もできます。共有特許の通常実施権には、他の共有者の同意が必要です。"}, {"id": "52g9", "exam": 52, "part": "学科", "no": 9, "ans": "ア", "type": "choice", "stem": "ア～ウを比較して，映画の著作物に関して，最も不適切と考えられるものはどれか。", "opts": [{"k": "ア", "t": "映画の著作物の著作者は，その映画の著作物において翻案され，又は複製された小説，脚本，音楽を担当し，その映画の著作物の全体的形成に創作的に寄与した者である。"}, {"k": "イ", "t": "映画の著作物の著作権は，その著作者が映画製作者に対し当該映画の著作物の製作に参加することを約束しているときは，当該映画製作者に帰属する。"}, {"k": "ウ", "t": "映画の著作物の著作権は，その著作物の公表後70年を経過するまでの間，存続する。"}], "neg": true, "topic": "著作権", "exp": "映画の著作者に、原作の小説・脚本・音楽の著作者は含まれません。映画の全体的形成に創作的に寄与した者が著作者です。"}, {"id": "52g10", "exam": 52, "part": "学科", "no": 10, "ans": "イ", "type": "choice", "stem": "ア～ウを比較して，種苗法に基づく品種登録制度に関して，最も適切と考えられるものはどれか。", "opts": [{"k": "ア", "t": "日本国では，植物の新品種については特許法では保護されないため，種苗法による保護が規定されている。"}, {"k": "イ", "t": "育成者権の存続期間は，品種登録の日から起算される。"}, {"k": "ウ", "t": "品種登録出願がされると，出願日から1年経過後に出願公表される。"}], "neg": false, "topic": "種苗", "exp": "育成者権の存続期間は品種登録の日から起算します（25年、木本は30年）。植物の新品種も特許の対象になり得ます。"}, {"id": "52g11", "exam": 52, "part": "学科", "no": 11, "ans": "ウ", "type": "choice", "stem": "ア～ウを比較して，職務著作に係る著作物（プログラムの著作物を除く）の著作者が法人等になる場合の要件として，最も不適切と考えられるものはどれか。", "opts": [{"k": "ア", "t": "法人等の発意に基づき，その法人等の業務に従事する者が職務上作成すること"}, {"k": "イ", "t": "法人等が自己の名義の下に公表すること"}, {"k": "ウ", "t": "法人等が従業者に対価を支払うこと"}], "neg": true, "topic": "著作権", "exp": "職務著作の要件に、対価の支払いはありません。会社の発意・職務上の作成・会社名義の公表などが要件です。"}, {"id": "52g12", "exam": 52, "part": "学科", "no": 12, "ans": "ア", "type": "choice", "stem": "ア～ウを比較して，地域団体商標制度と地理的表示保護制度に関して，最も適切と考えられるものはどれか。", "opts": [{"k": "ア", "t": "地理的表示保護制度によって登録を受けた地理的表示は，GIマークを付けることができる。"}, {"k": "イ", "t": "地域団体商標で登録された商標は，地理的表示保護制度によって登録を受けることができない。"}, {"k": "ウ", "t": "地域団体商標制度は，地域と商品名を組み合わせることなく，商品名だけで商標登録を受けることができる。"}], "neg": false, "topic": "商標", "exp": "地理的表示（GI）保護制度で登録されると、GIマークを付けられます。地域団体商標は「地域名＋商品名」が基本です。"}, {"id": "52g13", "exam": 52, "part": "学科", "no": 13, "ans": "ウ", "type": "choice", "stem": "ア～ウを比較して，意匠法に関して，最も適切と考えられるものはどれか。", "opts": [{"k": "ア", "t": "意匠権の存続期間は，意匠権の設定登録の日から10年である。"}, {"k": "イ", "t": "意匠登録出願は，経済産業省令で定める物品の区分により意匠毎にしなければならない。"}, {"k": "ウ", "t": "独立して取引の対象とはならない物品の部分について，意匠登録出願をすることができる。"}], "neg": false, "topic": "意匠", "exp": "物品の一部の部分（部分意匠）についても出願できます。存続期間は出願日から25年です。"}, {"id": "52g14", "exam": 52, "part": "学科", "no": 14, "ans": "ア", "type": "choice", "stem": "ア～ウを比較して，弁理士の業務として，最も適切と考えられるものはどれか。", "opts": [{"k": "ア", "t": "弁理士は，弁理士の名称を用いて，著作物に関する権利についての売買契約の締結の代理を行うことができる。"}, {"k": "イ", "t": "弁理士は，弁理士の名称を用いて，植物の新品種や地理的表示の保護に関する相談に応じることはできない。"}, {"k": "ウ", "t": "弁理士は，弁護士が同一の依頼者から受任している事件に限り，特許法に規定されている審決取消訴訟の訴訟代理人となることができる。"}], "neg": false, "topic": "その他", "exp": "弁理士は、著作物に関する権利の売買契約の代理ができます。品種や地理的表示の相談もできます。審決取消訴訟は、弁護士の共同受任が条件ではありません。"}, {"id": "52g15", "exam": 52, "part": "学科", "no": 15, "ans": "ウ", "type": "choice", "stem": "ア～ウを比較して，特許協力条約（PCT）に基づく国際出願に関して，最も適切と考えられるものはどれか。", "opts": [{"k": "ア", "t": "出願人は，国際出願日から18カ月以内に国際公開の請求をしなければならない。"}, {"k": "イ", "t": "出願内容は，優先日から18カ月経過後に各国際調査機関により国際公開される。"}, {"k": "ウ", "t": "出願人は，国内移行手続をするためには，原則として優先日から30カ月を経過する時までに各指定官庁に対し，所定の翻訳文を提出しなければならない。"}], "neg": false, "topic": "条約", "exp": "国内移行手続は、原則として優先日から30か月以内に翻訳文を提出します。国際公開は優先日から18か月後に、国際事務局が行います。"}, {"id": "52g16", "exam": 52, "part": "学科", "no": 16, "ans": "イ", "type": "choice", "stem": "ア～ウを比較して，著作者人格権等に関して，最も適切と考えられるものはどれか。", "opts": [{"k": "ア", "t": "著作者の同意を得ずに公表された著作物について，著作者は公表権を有しない。"}, {"k": "イ", "t": "著作物の原作品に，又は著作物の公衆への提供若しくは提示の際に，実名又は変名として周知のものが著作者名として通常の方法により表示されている者は，その著作物の著作者と推定される。"}, {"k": "ウ", "t": "著作者人格権は，その全部又は一部を譲渡することができる。"}], "neg": false, "topic": "著作権", "exp": "実名や周知の変名が通常の方法で著作者名として表示されている者は、著作者と推定されます。著作者人格権は譲渡できません。"}, {"id": "52g17", "exam": 52, "part": "学科", "no": 17, "ans": "ア", "type": "choice", "stem": "ア～ウを比較して，特許権に関して，最も適切と考えられるものはどれか。", "opts": [{"k": "ア", "t": "特許権侵害であると警告された場合，実施品が特許発明の技術的範囲に属するかどうかは，特許請求の範囲の記載に基づいて判断する。"}, {"k": "イ", "t": "特許権者は，警告しなければ，権利行使をすることはできない。"}, {"k": "ウ", "t": "特許権者が特許発明を継続して3年以上使用していない場合は，特許不使用取消審判を請求することができる。"}], "neg": false, "topic": "特許", "exp": "特許発明の技術的範囲は、特許請求の範囲の記載に基づいて判断します。警告なしでも権利行使できます。特許には不使用取消審判はありません。"}, {"id": "52g18", "exam": 52, "part": "学科", "no": 18, "ans": "イ", "type": "choice", "stem": "ア～ウを比較して，知的財産権のライセンスに関して独占禁止法に抵触する可能性が低い行為として，最も適切と考えられるものはどれか。", "opts": [{"k": "ア", "t": "ライセンス技術を用いた製品に関し，ライセンスを受けた者に対して競争技術の研究開発を禁止する行為"}, {"k": "イ", "t": "ライセンス技術を用いた製品に関し，ライセンスを受けた者に対して当該製品を輸出し得る地域を制限する行為"}, {"k": "ウ", "t": "ライセンス技術を用いた製品に関し，ライセンスを受けた者に対して特許権が消滅した後もロイヤリティを要求する行為"}], "neg": false, "topic": "その他", "exp": "選択肢のうち、輸出地域の制限は独占禁止法に抵触する可能性が低いものです。競争技術の研究開発の禁止や、特許消滅後のロイヤリティ請求は問題になります。"}, {"id": "52g19", "exam": 52, "part": "学科", "no": 19, "ans": "イ", "type": "choice", "stem": "ア～ウを比較して，特許法上の発明に関して，最も適切と考えられるものはどれか。", "opts": [{"k": "ア", "t": "自然法則を利用した技術的創作のうち高度のもの"}, {"k": "イ", "t": "自然法則を利用した技術的思想の創作のうち高度のもの"}, {"k": "ウ", "t": "産業上利用できる技術的思想の創作のうち高度のもの"}], "neg": false, "topic": "特許", "exp": "発明は、自然法則を利用した技術的思想の創作のうち高度のものです。"}, {"id": "52g20", "exam": 52, "part": "学科", "no": 20, "ans": "イ", "type": "choice", "stem": "ア～ウを比較して，著作権の存続期間に関して，最も不適切と考えられるものはどれか。", "opts": [{"k": "ア", "t": "法人の職務著作に係る著作物の場合は，その著作物の公表後70年を経過するまでの間，存続する。"}, {"k": "イ", "t": "共同著作物の場合は，その著作物の公表後70年を経過するまでの間，存続する。"}, {"k": "ウ", "t": "無名又は変名の著作物の場合は，その著作物の公表後70年を経過するまでの間，存続する。"}], "neg": true, "topic": "著作権", "exp": "共同著作物は、最後に死亡した著作者の死後70年です。公表後70年となるのは、職務著作・無名・変名などです。"}, {"id": "52g21", "exam": 52, "part": "学科", "no": 21, "ans": "イ", "type": "choice", "stem": "ア～ウを比較して，パリ条約に関して，最も適切と考えられるものはどれか。", "opts": [{"k": "ア", "t": "優先権の主張の基礎となる第一国の特許出願を取り下げた場合には，優先権の主張を伴う特許出願をした他の同盟国における特許出願が無効となる。"}, {"k": "イ", "t": "同盟国の国民は，優先権の主張の基礎となる第一国の特許出願を，自国の特許庁ではなく，他の同盟国の特許庁へ出願することができる。"}, {"k": "ウ", "t": "同盟国間に不平等が生じないよう，各同盟国の特許要件は同じである。"}], "neg": false, "topic": "条約", "exp": "第一国出願は、自国でなくても、いずれかの同盟国の特許庁にできます。各国の特許は独立しており、特許要件は各国で異なります。"}, {"id": "52g22", "exam": 52, "part": "学科", "no": 22, "ans": "ア", "type": "choice", "stem": "ア～ウを比較して，著作権の登録制度に関して，最も適切と考えられるものはどれか。", "opts": [{"k": "ア", "t": "著作権の移転は，登録しなければ第三者に対抗することができない。"}, {"k": "イ", "t": "著作権の登録は，権利の発生要件である。"}, {"k": "ウ", "t": "プログラムの著作物は，創作年月日の登録を受けることができない。"}], "neg": false, "topic": "著作権", "exp": "著作権の移転は、登録しなければ第三者に対抗できません。登録は権利の発生要件ではなく、プログラムも創作年月日の登録ができます。"}, {"id": "52g23", "exam": 52, "part": "学科", "no": 23, "ans": "イ", "type": "choice", "stem": "ア～ウを比較して，不正競争防止法に規定される営業秘密に関して，最も適切と考えられるものはどれか。", "opts": [{"k": "ア", "t": "秘密として管理されていなくても，公然と知られていなければ営業秘密として保護される。"}, {"k": "イ", "t": "技術上の秘密情報であっても，営業秘密として保護される場合がある。"}, {"k": "ウ", "t": "過去に失敗した研究データは，有用性の要件を満たしていないため，営業秘密として保護されない。"}], "neg": false, "topic": "その他", "exp": "営業秘密は、秘密管理性・有用性・非公知性の3要件を満たす情報です。技術上の情報も含まれ、失敗した研究データも有用なら保護され得ます。"}, {"id": "52g24", "exam": 52, "part": "学科", "no": 24, "ans": "イ", "type": "choice", "stem": "ア～ウを比較して，発明の新規性喪失の例外の規定に関して，最も適切と考えられるものはどれか。", "opts": [{"k": "ア", "t": "特許を受ける権利を有する者の自己の行為に起因して新規性を喪失した発明について，新規性喪失の例外の規定の適用を受けることができない。"}, {"k": "イ", "t": "特許を受ける権利を有する者がした特許出願に係る公開特許公報に掲載された発明について，新規性喪失の例外の規定の適用を受けることができない。"}, {"k": "ウ", "t": "新規性喪失の例外の規定の適用を受けることができるのは，日本国内で新規性を喪失した発明に限られる。"}], "neg": false, "topic": "特許", "exp": "新規性喪失の例外は、自己の行為による公知にも適用され、外国での公知も対象です。ただし、自己の出願の公開公報に載った発明には適用されません。"}, {"id": "52g25", "exam": 52, "part": "学科", "no": 25, "ans": "ア", "type": "choice", "stem": "ア～ウを比較して，著作権の制限に関して，最も適切と考えられるものはどれか。", "opts": [{"k": "ア", "t": "写真の撮影の際に他人の著作物が写り込んでしまったとしても，その他人の許諾を得ることなく当該著作物を利用することができる場合がある。"}, {"k": "イ", "t": "美術の著作物の原作品の所有者は，著作権者の許諾を得ることなく，その著作物の原作品を公に展示することができない。"}, {"k": "ウ", "t": "著作権者の許諾を得ることなくインターネット上で配信されている，いわゆる海賊版は，私的使用を目的とする場合であれば，ダウンロードして録音又は録画をすることができる。"}], "neg": false, "topic": "著作権", "exp": "写真撮影での写り込みなどは、許諾なしで利用できる場合があります。原作品の所有者は展示できます。海賊版と知りながらのダウンロードは、私的使用でも違法です。"}, {"id": "52g26", "exam": 52, "part": "学科", "no": 26, "ans": "イ", "type": "choice", "stem": "ア～ウを比較して，商標権侵害を理由とする警告に関して，最も適切と考えられるものはどれか。", "opts": [{"k": "ア", "t": "警告に対する対抗手段として，商標登録無効審判を請求する場合には，すべての無効理由について，いつでも請求することができる。"}, {"k": "イ", "t": "商標権侵害であると警告を受けた場合は，商標権が存在しているか，警告者が商標権者であるか，などを確認する。"}, {"k": "ウ", "t": "警告に対する対抗手段として，商標登録無効審判は誰でも請求することができるが，商標登録異議の申立ては利害関係人でなければ申立てをすることができない。"}], "neg": false, "topic": "商標", "exp": "警告を受けたら、まず商標権の存在と、警告者が権利者かを登録原簿で確認します。無効審判は、設定登録から5年を経過すると請求できなくなる理由もあります。"}, {"id": "52g27", "exam": 52, "part": "学科", "no": 27, "ans": "ウ", "type": "choice", "stem": "ア～ウを比較して，商標権等に関して，最も不適切と考えられるものはどれか。", "opts": [{"k": "ア", "t": "不使用取消審判により商標権が消滅した場合，当該商標権は同審判の請求の登録の日に消滅したものとみなされる。"}, {"k": "イ", "t": "他人の商標登録に係る商標登録出願の出願日前から自己の商標を使用していても，先使用権が認められない場合がある。"}, {"k": "ウ", "t": "登録商標が著名であって，その商標権に係る指定商品と非類似の商品について同一の商標を使用する場合には，当該商標権の効力が及ぶ。"}], "neg": true, "topic": "商標", "exp": "著名な商標でも、非類似の商品には商標権の効力は及びません（防護標章登録などの別の制度があります）。"}, {"id": "52g28", "exam": 52, "part": "学科", "no": 28, "ans": "イ", "type": "choice", "stem": "ア～ウを比較して，最も適切と考えられるものはどれか。", "opts": [{"k": "ア", "t": "実演家とレコード製作者は，譲渡権を有しない。"}, {"k": "イ", "t": "実演に関する著作隣接権の存続期間は，当該実演を行った時に始まる。"}, {"k": "ウ", "t": "放送事業者は，著作隣接権に含まれる放送事業者人格権を有する。"}], "neg": false, "topic": "著作権", "exp": "実演の著作隣接権は、実演を行った時に始まります。実演家もレコード製作者も譲渡権を持ち、人格権があるのは実演家だけです。"}, {"id": "52g29", "exam": 52, "part": "学科", "no": 29, "ans": "イ", "type": "choice", "stem": "ア～ウを比較して，特許出願の出願審査請求に関して，最も適切と考えられるものはどれか。", "opts": [{"k": "ア", "t": "特許出願の日から7年以内に出願審査請求がない場合，当該特許出願は取り下げられたものとみなされる。"}, {"k": "イ", "t": "特許出願人以外の者であっても，出願審査請求をすることができる。"}, {"k": "ウ", "t": "出願審査請求を取り下げることができるのは，特許出願人に限られる。"}], "neg": false, "topic": "特許", "exp": "出願審査請求は誰でもできます（出願日から3年以内）。7年は誤りで、取り下げもできません。"}, {"id": "52g30", "exam": 52, "part": "学科", "no": 30, "ans": "ウ", "type": "choice", "stem": "ア～ウを比較して，意匠登録の要件に関して，最も適切と考えられるものはどれか。", "opts": [{"k": "ア", "t": "新規性喪失の例外規定の適用を受けるためには，出願に係る意匠が公然知られた日から6カ月以内に意匠登録出願をしなければならない。"}, {"k": "イ", "t": "意匠登録出願後から意匠登録前までの間に日本国内において公然知られた形状等に基づいて当業者が容易に創作することができた意匠については，意匠登録を受けることができない。"}, {"k": "ウ", "t": "意匠登録出願前に外国において公然知られた意匠に類似する意匠については，新規性を有しないことを理由として意匠登録を受けることができない。"}], "neg": false, "topic": "意匠", "exp": "外国で公知になった意匠に類似する意匠は、新規性がないとして登録されません。新規性喪失の例外は、公知から1年以内の出願が条件です。"}, {"id": "52j1", "exam": 52, "part": "実技", "no": 1, "ans": "×", "ctx": "家具メーカーX社は，技術者甲が発明した発明Aについて，2024年8月8日午前8時に特許出願Pをした。その後，X社の知的財産部の部員乙は，調査の結果，次の事実1～2を確認した。\n事実1 2023年7月7日に開かれた国内の家具の展示会において，一般入場者の前で，甲が資料を配付して，発明Aについて説明していた。\n事実2 2024年8月8日午後8時のテレビ放送において，家具メーカーY社の丙によりなされた発明として，発明Aと同一の発明が国内で紹介されていた。", "type": "maru", "stem": "事実1に基づいて，特許出願Pに拒絶理由がないと考えられる場合は「○」を，拒絶理由があると考えられる場合は「×」を，選びなさい。", "opts": [{"k": "○", "t": ""}, {"k": "×", "t": ""}], "neg": false, "topic": "特許", "exp": "展示会で一般入場者に説明した発明は公知です。出願日が公知から1年を超えており、例外規定も使えないため、新規性がなく拒絶されます。"}, {"id": "52j2", "exam": 52, "part": "実技", "no": 2, "ans": "ウ", "ctx": "家具メーカーX社は，技術者甲が発明した発明Aについて，2024年8月8日午前8時に特許出願Pをした。その後，X社の知的財産部の部員乙は，調査の結果，次の事実1～2を確認した。\n事実1 2023年7月7日に開かれた国内の家具の展示会において，一般入場者の前で，甲が資料を配付して，発明Aについて説明していた。\n事実2 2024年8月8日午後8時のテレビ放送において，家具メーカーY社の丙によりなされた発明として，発明Aと同一の発明が国内で紹介されていた。", "type": "choice", "stem": "【理由群Ⅰ】の中から，問1において拒絶理由がない又は拒絶理由があると判断した理由として，最も適切と考えられるものを1つ選びなさい。", "opts": [{"k": "ア", "t": "特許出願Pに係る発明Aは，新規性を有しているため"}, {"k": "イ", "t": "特許出願Pに係る発明Aは，先願の地位を有するため"}, {"k": "ウ", "t": "特許出願Pに係る発明Aは，新規性を有していないため"}, {"k": "エ", "t": "特許出願Pに係る発明Aは，先願の地位を有しないため"}], "neg": false, "topic": "特許", "exp": "理由はウ。新規性を有していないためです。"}, {"id": "52j3", "exam": 52, "part": "実技", "no": 3, "ans": "○", "ctx": "家具メーカーX社は，技術者甲が発明した発明Aについて，2024年8月8日午前8時に特許出願Pをした。その後，X社の知的財産部の部員乙は，調査の結果，次の事実1～2を確認した。\n事実1 2023年7月7日に開かれた国内の家具の展示会において，一般入場者の前で，甲が資料を配付して，発明Aについて説明していた。\n事実2 2024年8月8日午後8時のテレビ放送において，家具メーカーY社の丙によりなされた発明として，発明Aと同一の発明が国内で紹介されていた。", "type": "maru", "stem": "事実2に基づいて，特許出願Pに拒絶理由がないと考えられる場合は「○」を，拒絶理由があると考えられる場合は「×」を，選びなさい。", "opts": [{"k": "○", "t": ""}, {"k": "×", "t": ""}], "neg": false, "topic": "特許", "exp": "同じ日でも時刻まで比べます。出願（午前8時）がテレビ放送（午後8時）より前なので、新規性を失わず、拒絶理由はありません。"}, {"id": "52j4", "exam": 52, "part": "実技", "no": 4, "ans": "ア", "ctx": "家具メーカーX社は，技術者甲が発明した発明Aについて，2024年8月8日午前8時に特許出願Pをした。その後，X社の知的財産部の部員乙は，調査の結果，次の事実1～2を確認した。\n事実1 2023年7月7日に開かれた国内の家具の展示会において，一般入場者の前で，甲が資料を配付して，発明Aについて説明していた。\n事実2 2024年8月8日午後8時のテレビ放送において，家具メーカーY社の丙によりなされた発明として，発明Aと同一の発明が国内で紹介されていた。", "type": "choice", "stem": "【理由群Ⅱ】の中から，問3において拒絶理由がない又は拒絶理由があると判断した理由として，最も適切と考えられるものを1つ選びなさい。", "opts": [{"k": "ア", "t": "特許出願Pに係る発明Aは，新規性を有しているため"}, {"k": "イ", "t": "特許出願Pに係る発明Aは，先願の地位を有するため"}, {"k": "ウ", "t": "特許出願Pに係る発明Aは，新規性を有していないため"}, {"k": "エ", "t": "特許出願Pに係る発明Aは，先願の地位を有しないため"}], "neg": false, "topic": "特許", "exp": "理由はア。新規性を有しているためです。"}, {"id": "52j5", "exam": 52, "part": "実技", "no": 5, "ans": "○", "ctx": "ある大学生は，コンテンツA及びコンテンツBについて，大学の授業で発言1～2をしている。\n発言1 「コンテンツAは，日本を代表する自動車メーカーであるX社の過去20年間の株価と為替相場の変動を数値でまとめたデータです。経済学に関する自分の論文に，コンテンツAを掲載する場合，データをまとめた人の許諾を得る必要はありません。」\n発言2 「コンテンツBは，人気漫画家の甲が色紙に描いたキャラクターイラストです。甲からこの色紙を購入した乙が，色紙に描かれたキャラクターイラストを自分のスマートフォンで撮影し，自分のブログにアップロードする場合，甲の許諾は不要です。」", "type": "maru", "stem": "発言1について，適切と考えられる場合は「○」を，不適切と考えられる場合は「×」を，選びなさい。", "opts": [{"k": "○", "t": ""}, {"k": "×", "t": ""}], "neg": false, "topic": "著作権", "exp": "株価と為替の数値データのような事実の羅列は、創作性がなく著作物ではありません。許諾は不要です。"}, {"id": "52j6", "exam": 52, "part": "実技", "no": 6, "ans": "ア", "ctx": "ある大学生は，コンテンツA及びコンテンツBについて，大学の授業で発言1～2をしている。\n発言1 「コンテンツAは，日本を代表する自動車メーカーであるX社の過去20年間の株価と為替相場の変動を数値でまとめたデータです。経済学に関する自分の論文に，コンテンツAを掲載する場合，データをまとめた人の許諾を得る必要はありません。」\n発言2 「コンテンツBは，人気漫画家の甲が色紙に描いたキャラクターイラストです。甲からこの色紙を購入した乙が，色紙に描かれたキャラクターイラストを自分のスマートフォンで撮影し，自分のブログにアップロードする場合，甲の許諾は不要です。」", "type": "choice", "stem": "【理由群Ⅲ】の中から，問5において適切又は不適切と判断した理由として，最も適切と考えられるものを1つ選びなさい。", "opts": [{"k": "ア", "t": "コンテンツAは著作物にあたらないため"}, {"k": "イ", "t": "コンテンツAは著作物にあたるが，著作権が制限される場合にあたるため"}, {"k": "ウ", "t": "コンテンツAは著作物にあたるため"}], "neg": false, "topic": "著作権", "exp": "理由はア。コンテンツAは著作物にあたらないためです。"}, {"id": "52j7", "exam": 52, "part": "実技", "no": 7, "ans": "×", "ctx": "ある大学生は，コンテンツA及びコンテンツBについて，大学の授業で発言1～2をしている。\n発言1 「コンテンツAは，日本を代表する自動車メーカーであるX社の過去20年間の株価と為替相場の変動を数値でまとめたデータです。経済学に関する自分の論文に，コンテンツAを掲載する場合，データをまとめた人の許諾を得る必要はありません。」\n発言2 「コンテンツBは，人気漫画家の甲が色紙に描いたキャラクターイラストです。甲からこの色紙を購入した乙が，色紙に描かれたキャラクターイラストを自分のスマートフォンで撮影し，自分のブログにアップロードする場合，甲の許諾は不要です。」", "type": "maru", "stem": "発言2について，適切と考えられる場合は「○」を，不適切と考えられる場合は「×」を，選びなさい。", "opts": [{"k": "○", "t": ""}, {"k": "×", "t": ""}], "neg": false, "topic": "著作権", "exp": "色紙を購入した人でも、イラストを撮影してブログに載せるのは複製と公衆送信です。著作権者（甲）の許諾が必要なので、発言は不適切です。"}, {"id": "52j8", "exam": 52, "part": "実技", "no": 8, "ans": "ウ", "ctx": "ある大学生は，コンテンツA及びコンテンツBについて，大学の授業で発言1～2をしている。\n発言1 「コンテンツAは，日本を代表する自動車メーカーであるX社の過去20年間の株価と為替相場の変動を数値でまとめたデータです。経済学に関する自分の論文に，コンテンツAを掲載する場合，データをまとめた人の許諾を得る必要はありません。」\n発言2 「コンテンツBは，人気漫画家の甲が色紙に描いたキャラクターイラストです。甲からこの色紙を購入した乙が，色紙に描かれたキャラクターイラストを自分のスマートフォンで撮影し，自分のブログにアップロードする場合，甲の許諾は不要です。」", "type": "choice", "stem": "【理由群Ⅳ】の中から，問7において適切又は不適切と判断した理由として，最も適切と考えられるものを1つ選びなさい。", "opts": [{"k": "ア", "t": "コンテンツBの公衆送信権が消尽しているため"}, {"k": "イ", "t": "コンテンツBの譲渡権が消尽しているため"}, {"k": "ウ", "t": "コンテンツBの公衆送信権の侵害となるため"}], "neg": false, "topic": "著作権", "exp": "理由はウ。公衆送信権の侵害になります。所有権と著作権は別のものです。"}, {"id": "52j9", "exam": 52, "part": "実技", "no": 9, "ans": "イ", "type": "choice", "stem": "ア～ウを比較して，特許法上の保護対象として，最も適切と考えられるものを1つ選びなさい。", "opts": [{"k": "ア", "t": "生成AIを高速に処理するための特殊なコンピュータ言語"}, {"k": "イ", "t": "太平洋の海水から人為的に抽出した化学物質"}, {"k": "ウ", "t": "重い荷物を積載しても転ばない自転車の人間による運転方法"}], "neg": false, "topic": "特許", "exp": "海水から人為的に抽出した化学物質は発明です。コンピュータ言語そのものや、人間の運転方法は発明にあたりません。"}, {"id": "52j10", "exam": 52, "part": "実技", "no": 10, "ans": "ア", "type": "choice", "stem": "家電メーカーX社は，掃除機Aに係る意匠登録出願をしたところ，掃除機Aと類似する掃除機Bに係る刊行物を引用した拒絶理由通知を受けた。X社の知的財産部の部員甲が権利化の方策を検討している。ア～ウを比較して，権利化の方策として，最も適切と考えられるものを1つ選びなさい。", "opts": [{"k": "ア", "t": "意見書を提出すること"}, {"k": "イ", "t": "分割出願すること"}, {"k": "ウ", "t": "不服審判を請求すること"}], "neg": false, "topic": "意匠", "exp": "意匠の拒絶理由通知には、意見書の提出（や補正）で対応します。不服審判は拒絶査定を受けた後です。"}, {"id": "52j11", "exam": 52, "part": "実技", "no": 11, "ans": "イ", "type": "choice", "stem": "文房具メーカーX社は，新しいボールペンの商品開発を検討している。ボールペンの商品名Aについて，先行商標調査をしたところ，Y社が，指定商品「ボールペン」について，商品名Aと類似する商標Bに係る商標権Mを所有していることが判明した。ア～ウを比較して，X社の知的財産部の部員甲と乙との会話として，最も適切と考えられるものを1つ選びなさい。", "opts": [{"k": "ア", "t": "甲 「商標権Mが設定登録された後の対抗策としては，無効審判請求しかないですね。」\n乙 「商標権Mに係る商標掲載公報が発行された日から3カ月以内であれば登録異議の申立てができます。」"}, {"k": "イ", "t": "甲 「Y社は，指定商品『ボールペン』について，商標Bを登録後5年以上ずっと使用していないことがわかりました。」\n乙 「それならば，不使用取消審判の請求ができますね。」"}, {"k": "ウ", "t": "甲 「わが社は，商標権Mに係る商標登録出願前に，商品名Aを付したボールペンについて短期間のテスト販売をしていました。」\n乙 「テスト販売により公知になったので，Y社から警告を受けた場合でも，先使用権を主張することができますね。」"}], "neg": false, "topic": "商標", "exp": "登録後3年以上使っていなければ、不使用取消審判を請求できます。問題文は5年以上なので請求できます。登録異議の申立ては公報発行から2か月以内で、テスト販売では先使用権は主張できません。"}, {"id": "52j12", "exam": 52, "part": "実技", "no": 12, "ans": "ア", "type": "choice", "stem": "甲と乙は共同で，楽曲Aを創作し，2005年4月30日にコンサートで初演奏した。その後甲は2020年3月10日に死亡し，乙は2024年12月1日に死亡した。ア～ウを比較して，この演奏に係る著作隣接権の存続期間が満了する時期として，最も適切と考えられるものを1つ選びなさい。", "opts": [{"k": "ア", "t": "2075年12月31日"}, {"k": "イ", "t": "2075年4月30日"}, {"k": "ウ", "t": "2094年12月31日"}], "neg": false, "topic": "著作権", "exp": "演奏の著作隣接権は、演奏した年の翌年から70年で、2075年12月31日です。作曲した人の死亡は関係ありません。"}, {"id": "52j13", "exam": 52, "part": "実技", "no": 13, "ans": "ウ", "type": "choice", "stem": "空調機器メーカーX社の知的財産部の部員が，X社が2024年11月1日に日本で特許出願Pをした発明について，外国での特許出願Qを検討している。ア～ウを比較して，2025年10月24日にした部員の発言として，最も不適切と考えられるものを1つ選びなさい。", "opts": [{"k": "ア", "t": "「パリ条約の優先期間の終了直前ですので，各国毎の出願書類が必要となるパリルートではなく，日本語で出願できる特許協力条約（PCT）による国際出願が適切であると考えます。特許協力条約であれば各指定国への翻訳文等の書面の提出は，国際調査報告を受領し検討した後であってもできます。」"}, {"k": "イ", "t": "「特許出願Pは，早期公開を請求して既に出願公開されています。特許出願Pに基づいてパリ条約上の優先権を主張して外国に特許出願Qをした場合，当該出願公開を理由に新規性を有しない発明として拒絶されることはありません。」"}, {"k": "ウ", "t": "「特許出願Pは，出願審査請求をして既に拒絶理由通知を受けています。したがって，日本の特許庁で審査が開始された特許出願Pに基づいて，パリ条約上の優先権を主張して外国に特許出願Qをすることはできません。」"}], "neg": true, "topic": "条約", "exp": "審査が始まっていても、拒絶理由通知を受けていても、12か月以内ならパリ条約の優先権を主張して外国出願できます。ウが誤りです。"}, {"id": "52j14", "exam": 52, "part": "実技", "no": 14, "ans": "ウ", "type": "choice", "stem": "高級靴メーカーX社は，形状が特徴的である靴Aに係る意匠権Dを保有している。Y社は，靴B，靴C及び靴Eを販売している。ア～ウを比較して，X社の知的財産部の部員の発言として，最も適切と考えられるものを1つ選びなさい。", "opts": [{"k": "ア", "t": "「調査の結果，Y社が販売している靴Bは，わが社から正式に購入した靴Aと同一であることがわかりました。この場合，意匠権Dの侵害に該当し，Y社に損害賠償請求をすることができます。」"}, {"k": "イ", "t": "「靴Aと靴Cのデザインは全体として極めてよく類似していますが，同一のデザインではないので，Y社に対して差止請求することはできません。」"}, {"k": "ウ", "t": "「意匠権Dに係る意匠登録出願より前に，Y社が既に靴Aとデザインが類似する靴Eを日本国内で販売していた場合には，Y社に対する損害賠償請求は認められません。」"}], "neg": false, "topic": "意匠", "exp": "Y社が意匠登録出願前から類似品を国内で販売していたなら、権利行使は難しく、損害賠償請求は認められません。正規に購入した製品の再販売は侵害になりません。"}, {"id": "52j15", "exam": 52, "part": "実技", "no": 15, "ans": "イ", "type": "choice", "stem": "スタートアップ企業であるX社では，技術者甲が発明Aをし，特許出願を希望している。X社の知的財産担当者乙は，未整備だった社内の職務発明に係る規程等について，検討している。ア～ウを比較して，乙の考えとして，最も不適切と考えられるものを1つ選びなさい。", "opts": [{"k": "ア", "t": "発明Aに係る特許出願の願書に，発明者としてX社を記載することはできない。"}, {"k": "イ", "t": "従業者がした職務発明について，勤務規則において，特許を受ける権利は，その発生した時からX社に帰属すると規定することはできない。"}, {"k": "ウ", "t": "従業者は，勤務規則により職務発明についてX社に特許を受ける権利を取得させたときは，相当の利益を受ける権利を有する。"}], "neg": true, "topic": "特許", "exp": "勤務規則で、特許を受ける権利を最初から会社に帰属させると定めることはできます。イの「できない」が誤りです。発明者は自然人のみです。"}, {"id": "52j16", "exam": 52, "part": "実技", "no": 16, "ans": "イ", "type": "choice", "stem": "ア～ウを比較して，甲が著作者になる場合として，最も適切と考えられるものを1つ選びなさい。", "opts": [{"k": "ア", "t": "X社の発意に基づき，X社に勤務する甲が職務としてプログラムを作成し，作成時における契約等において別段の定めがない場合"}, {"k": "イ", "t": "歌手乙が歌唱する曲からイメージして，甲が絵画を描いた場合"}, {"k": "ウ", "t": "新人芸術家丙が作品を制作するにあたり，甲が資金を提供した場合"}], "neg": false, "topic": "著作権", "exp": "絵画を描いた甲が著作者です。会社の職務著作や、資金提供者は、甲が著作者になる場合ではありません。"}, {"id": "52j17", "exam": 52, "part": "実技", "no": 17, "ans": "ウ", "type": "choice", "stem": "インテリアメーカーX社は，新しく商品開発したリクライニングチェアAに係る意匠登録出願を検討している。ア～ウを比較して，最も不適切と考えられるものを1つ選びなさい。", "opts": [{"k": "ア", "t": "リクライニングチェアAは，意匠登録出願後すぐには販売を開始しないので，意匠登録出願と同時に秘密意匠の請求をする。"}, {"k": "イ", "t": "リクライニングチェアAは，ヘッドレスト部分の形状に特徴があるので，部分意匠として意匠登録出願する。"}, {"k": "ウ", "t": "リクライニングチェアAは，意匠登録出願後すぐに販売を開始する予定なので，意匠登録出願と同時に出願審査請求をする。"}], "neg": true, "topic": "意匠", "exp": "意匠には出願審査請求制度がありません。秘密意匠の請求は出願と同時にでき、部分意匠もあります。"}, {"id": "52j18", "exam": 52, "part": "実技", "no": 18, "ans": "イ", "type": "choice", "stem": "アパレルメーカーX社は，指定商品「コート，マフラー」に係る商標権Mを有している。ア～ウを比較して，商標権Mに関して，最も適切と考えられるものを1つ選びなさい。", "opts": [{"k": "ア", "t": "X社がY社及びV社に商標権Mを移転し，Y社及びV社の共有となった場合，Y社は，V社の同意を得なくても，U社に商標権Mの持分を譲渡することができる。"}, {"k": "イ", "t": "X社は，Y社に指定商品「コート」に係る商標権Mを，T社に指定商品「マフラー」に係る商標権Mを，それぞれ移転することができる。"}, {"k": "ウ", "t": "X社がY社に商標権Mについて通常使用権を許諾した後，W社が商標権Mを侵害している場合，Y社は，W社に対して差止請求をすることができる。"}], "neg": false, "topic": "商標", "exp": "商標権は、指定商品ごとに分割して移転できます。共有の持分の譲渡は他の共有者の同意が必要で、通常使用権者は差止請求できません。"}, {"id": "52j19", "exam": 52, "part": "実技", "no": 19, "ans": "ア", "type": "choice", "stem": "ア～ウを比較して，著作者人格権の侵害となり得る行為として，最も適切と考えられるものを1つ選びなさい。", "opts": [{"k": "ア", "t": "漫画の雰囲気に合わせるため，漫画Aのタイトルを平仮名からローマ字に変更する行為"}, {"k": "イ", "t": "小学生の教科書に掲載するため，学校教育の目的上やむを得ないと認められる場合に，小説の一部を平仮名に変更する行為"}, {"k": "ウ", "t": "著作者から絵画を購入した者が，その絵画を自宅の居間に展示する行為"}], "neg": false, "topic": "著作権", "exp": "無断でタイトルを変えるのは、同一性保持権の侵害になり得ます。学校教育でやむを得ない改変や、所有者の展示は問題ありません。"}, {"id": "52j20", "exam": 52, "part": "実技", "no": 20, "ans": "イ", "type": "choice", "stem": "文房具メーカーX社の知的財産部の部員は，新規な発明Aに係る特許出願の出願書類の作成について，検討している。ア～ウを比較して，部員の考えとして，最も不適切と考えられるものを1つ選びなさい。", "opts": [{"k": "ア", "t": "特許請求の範囲には，わが社が特許を受けようとする発明Aを特定するために必要と認める事項を記載することが必要である。"}, {"k": "イ", "t": "発明の詳細な説明の記載には，発明Aの属する技術の分野における最新の知識を有する者がその実施をすることができる程度に明確かつ十分に記載することが必要である。"}, {"k": "ウ", "t": "要約書には，明細書，特許請求の範囲又は図面に記載した発明Aの概要を記載することが必要である。"}], "neg": true, "topic": "特許", "exp": "発明の詳細な説明は、「通常の知識を有する者（当業者）」が実施できるように書きます。「最新の知識」は誤りです。"}, {"id": "52j21", "exam": 52, "part": "実技", "no": 21, "ans": "ウ", "type": "choice", "stem": "ア～ウを比較して，X社の知的財産部の部員の発言として，最も不適切と考えられるものを1つ選びなさい。", "opts": [{"k": "ア", "t": "「著作権者であるX社は，その権利の一部である複製権のみについて，Y社に利用権を許諾することができます。」"}, {"k": "イ", "t": "「特許権者であるX社は，Y社に通常実施権を許諾する場合，特許庁に登録することは不要です。」"}, {"k": "ウ", "t": "「実用新案権者であるX社がY社に専用実施権を設定した後，X社は自己の実用新案権に係る登録実用新案を実施することができます。」"}], "neg": true, "topic": "実用新案", "exp": "専用実施権を設定した範囲では、権利者自身も実施できません。通常実施権は登録しなくても効力を生じます。"}, {"id": "52j22", "exam": 52, "part": "実技", "no": 22, "ans": "ア", "type": "choice", "stem": "ア～ウを比較して，著作権者の許諾を得るべき行為として，最も適切と考えられるものを1つ選びなさい。", "opts": [{"k": "ア", "t": "顧客に紹介するため，自社が開発した新しい技術が掲載されている新聞記事の画像を，メールマガジンに添付して送る行為"}, {"k": "イ", "t": "画家甲から絵画Aを購入した乙が，購入した金額よりも高い金額で丙に売る行為"}, {"k": "ウ", "t": "1990年代に人気のあったアイドルの曲を路上ライブで演奏するために，自宅で練習する行為"}], "neg": false, "topic": "著作権", "exp": "新聞記事の画像をメールマガジンに添付するのは、複製・公衆送信で許諾が必要です。購入した絵画の転売や、自宅での練習は許諾不要です。"}, {"id": "52j23", "exam": 52, "part": "実技", "no": 23, "ans": "ウ", "type": "choice", "stem": "自動車メーカーX社において，特許協力条約（PCT）に基づく国際出願をすることを検討している。ア～ウを比較して，X社の知的財産部の部員の発言として，最も適切と考えられるものを1つ選びなさい。", "opts": [{"k": "ア", "t": "「国際出願した後，所定の期間内に，国際調査機関に対して国際調査を行うことを請求する必要があります。」"}, {"k": "イ", "t": "「国際出願した後，出願人が国内移行手続を行わなくても，各指定国で審査が開始されます。」"}, {"k": "ウ", "t": "「国際出願した後，優先日から18カ月経過する前であっても，国際公開が行われることがあります。」"}], "neg": false, "topic": "条約", "exp": "国際公開は優先日から18か月で行われますが、出願人の請求で早まることがあります。国際調査は請求不要で、国内移行手続をしないと各国での審査は始まりません。"}, {"id": "52j24", "exam": 52, "part": "実技", "no": 24, "ans": "イ", "type": "choice", "stem": "電機メーカーであるX社は，Y社の特許権Pに係る半導体製造装置と同一の半導体製造装置Aを製造販売することを計画している。ア～ウを比較して，X社が，Y社に無断で行った場合でも，Y社の特許権Pを侵害しない行為として，最も適切と考えられるものを1つ選びなさい。", "opts": [{"k": "ア", "t": "市場動向を調査するために，電気電子機器の総合展示会で自ら製造する半導体製造装置Aのカタログを販売のために配付する行為"}, {"k": "イ", "t": "半導体製造装置の研究のために，半導体製造装置Aを製造する行為"}, {"k": "ウ", "t": "1回限りの販売のために，半導体製造装置Aを製造する行為"}], "neg": false, "topic": "特許", "exp": "試験・研究のための実施は、特許権の効力が及びません。カタログの配付（譲渡の申出）や、製造して販売する行為は侵害です。"}, {"id": "52j25", "exam": 52, "part": "実技", "no": 25, "ans": "ア", "type": "choice", "stem": "文具メーカーX社は，X社が保有する意匠権Dについて，Y社に対してライセンスしている。ア～ウを比較して，X社の行為として，最も不適切と考えられるものを1つ選びなさい。", "opts": [{"k": "ア", "t": "X社は，X社がY社へ全範囲を対象とする専用実施権を設定登録した後に，意匠権Dに係る登録意匠に類似する意匠を実施した。"}, {"k": "イ", "t": "X社は，X社がY社へ通常実施権を許諾した後に，意匠権Dを譲渡した。"}, {"k": "ウ const TOPICS=['特許','実用新案','意匠','商標','著作権','条約','種苗','その他'];
const EXAMS=[{n:54,d:'2026年7月'},{n:53,d:'2026年3月'},{n:52,d:'2025年11月'}];
const NEXT_EXAM=new Date('2026-11-15T00:00:00+09:00');
const SKEY='chizai3q.v1';
let store={res:{},last:{}};
try{const s=localStorage.getItem(SKEY);if(s)store=Object.assign(store,JSON.parse(s))}catch(e){}
function save(){try{localStorage.setItem(SKEY,JSON.stringify(store))}catch(e){}}
const $app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const BYID=Object.fromEntries(DATA.map(q=>[q.id,q]));
const label=q=>`第${q.exam}回 ${q.part} 問${q.no}`;
let S=null; // session
let tab='quiz';

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function stats(ids){let a=0,c=0;for(const id of ids){const r=store.res[id];if(r){a++;if(r.ok)c++}}return{a,c}}

function home(){
  const days=Math.ceil((NEXT_EXAM-new Date())/86400000);
  const wrong=DATA.filter(q=>store.res[q.id]&&!store.res[q.id].ok).map(q=>q.id);
  const unseen=DATA.filter(q=>!store.res[q.id]).map(q=>q.id);
  let h='';
  if(days>0&&days<60)h+=`<section class="card count"><b>あと${days}日</b><span>第55回 2026年11月15日（日）</span></section>`;
  h+=`<section><h2>過去問を回ごとに解く</h2><div class="card rows">`;
  for(const e of EXAMS){
    h+=`<div class="erow"><div class="lab"><b>第${e.n}回</b><small>${e.d}</small></div>`;
    for(const p of ['学科','実技']){
      const ids=DATA.filter(q=>q.exam===e.n&&q.part===p).map(q=>q.id);
      const l=store.last[`${e.n}${p}`];
      h+=`<button class="btn" data-start="exam" data-e="${e.n}" data-p="${p}">${p} ${ids.length}問<span class="sub">${l?`前回 ${l.c}/${l.t}`:'未挑戦'}</span></button>`;
    }
    h+=`</div>`;
  }
  h+=`</div></section><section><h2>分野別に解く</h2><div class="chips">`;
  for(const t of TOPICS){
    const ids=DATA.filter(q=>q.topic===t).map(q=>q.id);
    const st=stats(ids);
    h+=`<button class="chip" data-start="topic" data-t="${t}"><b>${t}</b><small>${ids.length}問${st.a?` ・ 正答率 ${Math.round(st.c/st.a*100)}%`:''}</small></button>`;
  }
  h+=`</div></section><section><h2>復習・ランダム</h2><div class="acts">
    <button class="btn" data-start="wrong" ${wrong.length?'':'disabled'}>間違えた問題 ${wrong.length}問</button>

    <p class="tiny" style="margin-top:12px">学科は ア〜ウ の3択、実技は ○× と ア〜ウ（一部は語群から選択・数字入力）です。本試験と同じ形式にしています。</p>
    <button class="link" id="reset">解答記録を消す</button><span class="tiny" id="resetmsg"></span></section>
    <p class="foot">解答は添付いただいた過去問の正解表どおりです。解説は本アプリ用に作成した説明で、公式の解説ではありません。最終確認は公式の条文・テキストでお願いします。</p>`;
  $app.innerHTML=h;

function start(kind,el){
  let ids=[],title='',key=null,ordered=false;
  if(kind==='exam'){const e=+el.dataset.e,p=el.dataset.p;ids=DATA.filter(q=>q.exam===e&&q.part===p).map(q=>q.id);title=`第${e}回 ${p}`;key=`${e}${p}`;ordered=true}
  else if(kind==='topic'){const t=el.dataset.t;ids=shuffle(DATA.filter(q=>q.topic===t).map(q=>q.id));title=`分野別：${t}`}
  else if(kind==='wrong'){ids=shuffle(DATA.filter(q=>store.res[q.id]&&!store.res[q.id].ok).map(q=>q.id));title='間違えた問題'}
  else if(kind==='unseen'){ids=shuffle(DATA.filter(q=>!store.res[q.id]).map(q=>q.id)).slice(0,30);title='まだ解いていない問題'}
  else{ids=shuffle(DATA.map(q=>q.id)).slice(0,20);title='ランダム20問'}
  if(!ids.length)return;
  S={title,key,ids,i:0,done:{},ok:0};
  quiz();window.scrollTo(0,0);
}
function retry(ids,title){S={title,key:null,ids:shuffle(ids),i:0,done:{},ok:0};quiz();window.scrollTo(0,0)}

function paras(t){return t.split('\n').map(p=>`<p>${esc(p)}</p>`).join('')}
function quiz(){
  const q=BYID[S.ids[S.i]];
  const d=S.done[q.id];
  const n=S.ids.length;
  let h=`<div class="qtop"><span class="t">${esc(S.title)}</span><span class="t" style="font-variant-numeric:tabular-nums">${S.i+1} / ${n}</span></div>
  <div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${S.i}"><i style="width:${(S.i+(d?1:0))/n*100}%"></i></div>
  <section class="card"><div class="meta"><span class="qid">${label(q)}</span>`;
  if(d)h+=`<span class="tag">${q.topic}</span>`;
  if(q.type==='choice'&&q.part==='学科'||q.type==='choice'&&/最も(不)?適切/.test(q.stem)&&!/語群|理由群/.test(q.stem)){
    h+=q.neg?`<span class="neg">「不適切」を選ぶ</span>`:`<span class="tag" style="background:var(--surface2);color:var(--muted)">「適切」を選ぶ</span>`;
  }
  h+=`</div>`;
  if(q.ctx)h+=`<div class="ctx">${paras(q.ctx)}</div>`;
  h+=`<div class="stem">${esc(q.stem)}</div>`;
  if(q.type==='num'){
    h+=`<div class="numrow"><input id="numin" inputmode="numeric" autocomplete="off" aria-label="答え" ${d?`value="${esc(d.given)}" disabled`:''}>
      <button class="btn pri" id="numgo" ${d?'disabled':''}>答え合わせ</button></div>`;
  }else{
    h+=`<div class="opts ${q.type==='maru'?'two':''}">`;
    for(const o of q.opts){
      let cls='opt'+(q.type==='maru'?' maru':'');
      if(d){if(o.k===q.ans)cls+=' ok';else if(o.k===d.given)cls+=' ng'}
      h+=`<button class="${cls}" data-k="${o.k}" ${d?'disabled':''}><span class="k">${o.k}</span>${o.t?`<span class="tx">${esc(o.t)}</span>`:''}</button>`;
    }
    h+=`</div>`;
  }
  if(d){
    h+=`<div class="fb ${d.right?'ok':'ng'}" role="status"><h3>${d.right?'正解':'不正解　正解は「'+esc(q.ans)+'」'}</h3><p>${esc(q.exp)}</p></div>`;
    h+=`<div class="nextrow"><button class="link" id="quit">やめてホームへ</button><button class="btn pri" id="next">${S.i+1<n?'次の問題 →':'結果を見る'}</button></div>`;
  }else{
    h+=`<div class="nextrow"><button class="link" id="quit">やめてホームへ</button></div>`;
  }
  h+=`</section>`;
  $app.innerHTML=h;
  if(q.type==='num'&&!d)document.getElementById('numin').focus();
}
function answer(given){
  const q=BYID[S.ids[S.i]];
  if(S.done[q.id])return;
  const right=hwnorm(given)===q.ans;
  S.done[q.id]={given,right};
  if(right)S.ok++;
  const r=store.res[q.id]||{n:0,w:0};
  r.n++;if(!right)r.w++;r.ok=right?1:0;store.res[q.id]=r;save();
  quiz();
}
function hwnorm(s){return String(s).trim().replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/[\s,，]/g,'')}
function result(){
  const n=S.ids.length,c=S.ok,pct=Math.round(c/n*100);
  if(S.key){store.last[S.key]={c,t:n};save()}
  const wrong=S.ids.filter(id=>!S.done[id].right);
  let h=`<section class="card"><h2>${esc(S.title)} の結果</h2><div class="score"><b>${c} / ${n}</b><span>正答率 ${pct}%${S.key?`　合格ラインの目安は7割（${Math.ceil(n*0.7)}問）`:''}</span></div>
  <div class="prog" style="margin-top:10px"><i style="width:${pct}%"></i></div></section>`;
  if(wrong.length){
    h+=`<section class="card"><h2>間違えた問題 ${wrong.length}問</h2><ul class="wrong">`;
    for(const id of wrong){const q=BYID[id];h+=`<li><b>${label(q)}</b><span>正解「${esc(q.ans)}」 ${esc(q.exp.slice(0,60))}${q.exp.length>60?'…':''}</span></li>`}
    h+=`</ul></section><div class="acts"><button class="btn pri" id="retry">間違えた問題をもう一度</button><button class="btn" id="home">ホームへ</button></div>`;
  }else h+=`<div class="acts"><button class="btn pri" id="home">ホームへ</button></div>`;
  $app.innerHTML=h;window.scrollTo(0,0);
}

function points(){
  let h=`<section><h2>数字と条件の一覧（出題された内容から整理）</h2><div class="tablewrap"><table><thead><tr><th>分野</th><th>項目</th><th>要点</th></tr></thead><tbody>`;
  for(const [a,b,c] of POINTS)h+=`<tr><td>${a}</td><td>${b}</td><td>${esc(c)}</td></tr>`;
  h+=`</tbody></table></div></section><section class="card"><h2>引っかけやすいところ</h2><ul class="pts">${TRAPS.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></section>
  <p class="foot">この表は過去問の解説をもとに整理したものです。試験の前日は、出題画面の「間違えた問題」を繰り返すのが効率的です。</p>`;
  $app.innerHTML=h;
}

function render(){
  document.getElementById('tab-quiz').setAttribute('aria-selected',tab==='quiz');
  document.getElementById('tab-points').setAttribute('aria-selected',tab==='points');
  if(tab==='points')return points();
  if(!S)return home();
  if(S.i>=S.ids.length)return result();
  quiz();
}
document.getElementById('tab-quiz').onclick=()=>{tab='quiz';render();window.scrollTo(0,0)};
document.getElementById('tab-points').onclick=()=>{tab='points';render();window.scrollTo(0,0)};
$app.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.start){start(t.dataset.start,t);return}
  if(t.classList.contains('opt')&&S){answer(t.dataset.k);return}
  if(t.id==='numgo'){const v=document.getElementById('numin').value;if(v.trim())answer(v);return}
  if(t.id==='next'){S.i++;render();window.scrollTo(0,0);return}
  if(t.id==='quit'||t.id==='home'){S=null;render();window.scrollTo(0,0);return}
  if(t.id==='retry'){const ids=S.ids.filter(id=>!S.done[id].right);retry(ids,'間違えた問題の再挑戦');return}
  if(t.id==='reset'){store={res:{},last:{}};save();render();return}
});
document.addEventListener('keydown',e=>{
  if(tab!=='quiz'||!S||S.i>=S.ids.length)return;
  const q=BYID[S.ids[S.i]];
  if(e.key==='Enter'){
    if(q.type==='num'&&!S.done[q.id]&&document.activeElement.id==='numin'){const v=document.activeElement.value;if(v.trim())answer(v);return}
    if(S.done[q.id]){e.preventDefault();S.i++;render();window.scrollTo(0,0)}
    return;
  }
  if(S.done[q.id]||q.type==='num'||e.target.tagName==='INPUT')return;
  const i=parseInt(e.key,10)-1;
  if(i>=0&&i<q.opts.length)answer(q.opts[i].k);
});
render();
</script>
