<title>知財3級 過去問ドリル</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* Layout: 1 column study tool. Sticky top bar with two tabs (出題 / 要点), cards for home, one question per screen. */
:root{
  --bg:#F2F5F8; --surface:#FFFFFF; --surface2:#E8EEF3; --ink:#111C27; --muted:#546576; --line:#D3DCE4;
  --accent:#1F4FBF; --accent-ink:#FFFFFF; --accent-soft:#E4ECFB;
  --ok:#14704B; --ok-bg:#E1F3EA; --ng:#B3261E; --ng-bg:#FBE8E6; --warn:#7A4E00; --warn-bg:#FFF1CF;
  --font:"Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D141B; --surface:#151F29; --surface2:#1E2B37; --ink:#E8EFF5; --muted:#92A3B3; --line:#2B3A48;
    --accent:#86AEF7; --accent-ink:#0D141B; --accent-soft:#1B2A44;
    --ok:#62D6A3; --ok-bg:#12312A; --ng:#FF8F85; --ng-bg:#3A1E1C; --warn:#F2C96B; --warn-bg:#382D12;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D141B; --surface:#151F29; --surface2:#1E2B37; --ink:#E8EFF5; --muted:#92A3B3; --line:#2B3A48;
  --accent:#86AEF7; --accent-ink:#0D141B; --accent-soft:#1B2A44;
  --ok:#62D6A3; --ok-bg:#12312A; --ng:#FF8F85; --ng-bg:#3A1E1C; --warn:#F2C96B; --warn-bg:#382D12;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.75;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px))) calc(-1*max(16px,env(safe-area-inset-right,0px)));
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
.bar-in{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px}
.brand{font-weight:700;font-size:17px;letter-spacing:.02em;white-space:nowrap}
.brand small{font-weight:500;color:var(--muted);font-size:12px;margin-left:8px}
.tabs{display:flex;gap:4px;background:var(--surface2);padding:3px;border-radius:10px}
.tab{border:0;background:transparent;padding:6px 14px;border-radius:8px;font-weight:500;font-size:14px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0/.12)}
main{max-width:760px;margin:0 auto;padding-top:20px;display:flex;flex-direction:column;gap:20px}
h2{font-size:15px;margin:0 0 8px;letter-spacing:.04em;color:var(--muted);font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.count{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.count b{font-size:30px;line-height:1.2;font-variant-numeric:tabular-nums}
.count span{color:var(--muted);font-size:14px}
.rows{display:flex;flex-direction:column;gap:10px}
.erow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center}
.erow .lab{min-width:0}
.erow .lab b{display:block}
.erow .lab small{color:var(--muted);font-size:12px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;min-height:44px;text-align:left}
.btn:hover{border-color:var(--accent)}
.btn .sub{display:block;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700;text-align:center}
.btn.pri:hover{filter:brightness(1.06)}
.btn[disabled]{opacity:.45;cursor:default}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;min-height:56px;text-align:left}
.chip:hover{border-color:var(--accent)}
.chip b{display:block}
.chip small{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.tiny{font-size:13px;color:var(--muted)}
.link{border:0;background:none;color:var(--muted);text-decoration:underline;padding:4px 0;font-size:13px}
/* quiz */
.qtop{display:flex;align-items:center;justify-content:space-between;gap:12px}
.qtop .t{font-weight:700;font-size:14px;color:var(--muted)}
.prog{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .2s}
.qid{font-weight:700;font-size:14px}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
.tag{font-size:12px;padding:1px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:500}
.neg{font-size:12px;padding:1px 8px;border-radius:99px;background:var(--warn-bg);color:var(--warn);font-weight:700}
.ctx{background:var(--surface2);border-radius:10px;padding:10px 14px;margin:8px 0 12px;font-size:15px}
.ctx p{margin:0 0 6px}
.ctx p:last-child{margin:0}
.stem{margin:6px 0 14px;font-weight:500;white-space:pre-line}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;text-align:left;border:1.5px solid var(--line);background:var(--surface);
  border-radius:10px;padding:10px 14px;min-height:48px}
.opt:hover:not([disabled]){border-color:var(--accent);background:var(--accent-soft)}
.opt .k{font-weight:700;min-width:1.6em;text-align:center;border-right:1px solid var(--line);padding-right:12px;color:var(--accent)}
.opt .tx{white-space:pre-line;overflow-wrap:anywhere}
.opt.maru{grid-template-columns:1fr;text-align:center}
.opt.maru .k{border:0;padding:0;font-size:26px;line-height:1.3}
.opts.two{flex-direction:row}
.opts.two .opt{flex:1}
.opt[disabled]{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.ok .k{color:var(--ok)}
.opt.ng{border-color:var(--ng);background:var(--ng-bg)}
.opt.ng .k{color:var(--ng)}
.numrow{display:flex;gap:8px;flex-wrap:wrap}
.numrow input{font:inherit;font-variant-numeric:tabular-nums;padding:10px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);width:12em;max-width:100%;min-height:48px}
.fb{margin-top:14px;border-radius:10px;padding:12px 14px;border:1.5px solid}
.fb.ok{background:var(--ok-bg);border-color:var(--ok)}
.fb.ng{background:var(--ng-bg);border-color:var(--ng)}
.fb h3{margin:0 0 4px;font-size:16px}
.fb.ok h3{color:var(--ok)}
.fb.ng h3{color:var(--ng)}
.fb p{margin:0}
.nextrow{display:flex;justify-content:space-between;gap:8px;margin-top:14px;flex-wrap:wrap}
/* result */
.score{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.score b{font-size:44px;line-height:1.1;font-variant-numeric:tabular-nums}
.score span{color:var(--muted)}
.wrong{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.wrong li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.wrong li b{white-space:nowrap}
.wrong li span{overflow-wrap:anywhere;color:var(--muted)}
/* points */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:14.5px}
th,td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;line-height:1.6}
th{font-size:12px;letter-spacing:.06em;color:var(--muted);background:var(--surface2);position:sticky;top:0}
tr:last-child td{border-bottom:0}
td:first-child{white-space:nowrap;font-weight:700}
td.n{font-variant-numeric:tabular-nums}
ul.pts{margin:0;padding-left:1.2em}
ul.pts li{margin:4px 0}
.foot{font-size:12.5px;color:var(--muted);line-height:1.7}
@media (max-width:520px){
  .erow{grid-template-columns:1fr 1fr}
  .erow .lab{grid-column:1/-1}
  .brand small{display:none}
}
@media (prefers-reduced-motion:reduce){.prog i{transition:none}}
</style>

<div class="bar"><div class="bar-in">
  <div class="brand">知財3級 過去問<small>第52〜54回</small></div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-quiz" aria-selected="true">出題</button>
    <button class="tab" role="tab" id="tab-points" aria-selected="false">要点</button>
  </div>
</div></div>
<main id="app"></main>

<script>
const DATA=[{"id": "54g1", "exam": 54, "part": "学科", "no": 1, "ans": "ウ", "type": "choice", "stem": "ア～ウを比較して，著作権法上の引用に関して，最も不適切と考えられるものはどれか。", "opts": [{"k": "ア", "t": "他人の著作物を引用して複製する場合，利用態様に応じた合理的方法により，著作物の出所を明示しなければならない。"}, {"k": "イ", "t": "引用は，公正な慣行に合致するものであり，かつ，引用の目的上正当な範囲内で行われるものでなければならない。"}, {"k": "ウ", "t": "営利を目的としない場合であれば，公表されていない他人の著作物を引用して利用することができる。"}], "neg": true, "topic": "著作権", "exp": "引用できるのは公表された著作物だけです。営利かどうかは関係なく、未公表の著作物は引用できません。"}, {"id": "54g2", "exam": 54, "part": "学科", "no": 2, "ans": "ウ", "type": "choice", "stem": "ア～ウを比較して，拒絶理由通知を受けた特許出願人の対応として，最も不適切と考えられるものはどれか。", "opts": [{"k": "ア", "t": "特許出願を分割する。"}, {"k": "イ", "t": "手続補正書を提出する。"}, {"k": "ウ", "t": "不服審判を請求する。"}], "neg": true, "topic": "特許", "exp": "拒絶理由通知への対応は、意見書・手続補正書・出願の分割です。不服審判は拒絶査定を受けた後に請求するものです。"}, {"id": "54g3", "exam": 54, "part": "学科", "no": 3, "ans": "ア", "type": "choice", "stem": "ア～ウを比較して，弁理士等の業務に関して，最も適切と考えられるものはどれか。", "opts": [{"k": "ア", "t": "弁理士が所属する法人である弁理士法人は，その法人名義で特許出願の代理をすることができる。"}, {"k": "イ", "t": "弁理士は，自己が出願について代理した特許権に限り，単独でその特許権のライセンス契約に関する交渉の代理人になることができる。"}, {"k": "ウ", "t": "弁理士は，商標権についての売買契約の締結の代理をすることができない。"}], "neg": false, "topic": "その他", "exp": "弁理士法人は法人名義で特許出願を代理できます。イは「自己が代理した特許権に限り」が誤りで、ウは商標権の売買の代理もできるので誤りです。"}, {"id": "54g4", "exam": 54, "part": "学科", "no": 4, "ans": "ウ", "type": "choice", "stem": "ア～ウを比較して，意匠権に関して，最も適切と考えられるものはどれか。", "opts": [{"k": "ア", "t": "意匠権の存続期間は，設定登録の日から25年で終了する。"}, {"k": "イ", "t": "意匠権の効力は，実施製品に係る物品が登録意匠に係る物品と類似し，かつ実施製品の形状等が登録意匠に係る形状等と類似する場合には，及ばない。"}, {"k": "ウ", "t": "意匠権は，登録査定を受けた後，第1年分の登録料を納付し設定登録がなされると発生する。"}], "neg": false, "topic": "意匠", "exp": "意匠権は、登録査定後に第1年分の登録料を納付して設定登録されると発生します。存続期間は出願日から25年で、類似の意匠にも効力が及びます。"}, {"id": "54g5", "exam": 54, "part": "学科", "no": 5, "ans": "ア", "type": "choice", "stem": "ア～ウを比較して，特許出願の出願公開に関して，最も適切と考えられるものはどれか。", "opts": [{"k": "ア", "t": "特許出願の出願日から1年後に，出願公開される場合がある。"}, {"k": "イ", "t": "特許出願人は，出願公開の請求を取り下げることができる。"}, {"k": "ウ", "t": "出願公開がされた後に，審査官から出願人に拒絶理由が通知されることはない。"}], "neg": false, "topic": "特許", "exp": "出願公開は原則として出願日から1年6か月後です。出願公開の請求をすると、1年後など早く公開される場合があります。"}, {"id": "54g6", "exam": 54, "part": "学科", "no": 6, "ans": "ウ", "type": "choice", "stem": "ア～ウを比較して，商標権に関して，最も適切と考えられるものはどれか。", "opts": [{"k": "ア", "t": "商標権は，その一部の指定商品を分割して他人に移転することはできない。"}, {"k": "イ", "t": "自己の商標権に係る禁止権と他人の商標権に係る禁止権とが重複する範囲について，当該他人は登録商標を使用することができる。"}, {"k": "ウ", "t": "商標権の設定登録後1年を経過する前であっても，登録商標の不正使用を理由とする不正使用取消審判を請求することができる。"}], "neg": false, "topic": "商標", "exp": "不正使用取消審判は、設定登録後すぐでも請求できます。不使用取消審判と違い、期間の条件がありません。"}, {"id": "54g7", "exam": 54, "part": "学科", "no": 7, "ans": "ア", "type": "choice", "stem": "ア～ウを比較して，著作権等の存続期間に関して，最も適切と考えられるものはどれか。", "opts": [{"k": "ア", "t": "映画の著作物の著作権は，公表後70年を経過するまでの間，存続する。"}, {"k": "イ", "t": "共同著作物の著作権は，最初に死亡した著作者の死後70年を経過するまでの間，存続する。"}, {"k": "ウ", "t": "発行されたレコードのレコード製作者の権利は，最初に音を固定した後70年を経過するまでの間，存続する。"}], "neg": false, "topic": "著作権", "exp": "映画の著作権は公表後70年です。共同著作物は最後に死亡した著作者の死後70年、レコード製作者の権利は発行後70年です。"}, {"id": "54g8", "exam": 54, "part": "学科", "no": 8, "ans": "イ", "type": "choice", "stem": "ア～ウを比較して，特許出願の出願審査の請求に関して，最も不適切と考えられるものはどれか。", "opts": [{"k": "ア", "t": "特許出願人以外の者であっても，出願審査の請求をすることができる。"}, {"k": "イ", "t": "特許出願人は，出願審査請求を取り下げることができる。"}, {"k": "ウ", "t": "特許出願人は，特許出願と同時に出願審査の請求をすることができる。"}], "neg": true, "topic": "特許", "exp": "出願審査請求は、一度すると取り下げられません。誰でも請求でき、出願と同時にもできます。"}, {"id": "54g9", "exam": 54, "part": "学科", "no": 9, "ans": "ア", "type": "choice", "stem": "ア～ウを比較して，パリ条約の優先権制度に関して，最も不適切と考えられるものはどれか。", "opts": [{"k": "ア", "t": "優先期間は，実用新案，意匠のいずれについても6カ月である。"}, {"k": "イ", "t": "パリ条約の同盟国にした最初の第1国出願に基づいて，優先期間内に他の同盟国にパリ条約上の優先権を主張して第2国出願をしたときには，当該第2国出願に係る発明の新規性などの登録要件は，第1国出願の時点で判断される。"}, {"k": "ウ", "t": "パリ条約に規定された優先期間は，同盟国の事情により短縮することはできない。"}], "neg": true, "topic": "条約", "exp": "パリ条約の優先期間は、特許・実用新案が12か月、意匠・商標が6か月です。実用新案を6か月としたアが誤りです。"}, {"id": "54g10", "exam": 54, "part": "学科", "no": 10, "ans": "ウ", "type": "choice", "stem": "ア～ウを比較して，著作権に関して，最も適切と考えられるものはどれか。", "opts": [{"k": "ア", "t": "著作権の侵害行為で被った損害について，損害賠償の請求をすることができるが，不当利得返還請求はできない。"}, {"k": "イ", "t": "著作者は，著作物を創作したときに，その著作権を登録しなければならない。"}, {"k": "ウ", "t": "他人の著作物に依拠して，実質的に類似の範囲にある著作物を作成して，無断で利用すると著作権侵害となる。"}], "neg": false, "topic": "著作権", "exp": "他人の著作物に依拠して、似た範囲のものを無断で利用すると侵害です。著作権は登録不要で、不当利得返還請求もできます。"}, {"id": "54g11", "exam": 54, "part": "学科", "no": 11, "ans": "ウ", "type": "choice", "stem": "ア～ウを比較して，特許権に関して，最も適切と考えられるものはどれか。", "opts": [{"k": "ア", "t": "特許権者は，警告しなければ，権利行使をすることはできない。"}, {"k": "イ", "t": "特許権者が特許発明を継続して3年以上使用していない場合は，特許不使用取消審判を請求することができる。"}, {"k": "ウ", "t": "特許無効審判は，利害関係人でなければ請求することができない。"}], "neg": false, "topic": "特許", "exp": "特許無効審判を請求できるのは利害関係人です。警告なしでも権利行使はでき、不使用取消審判は商標の制度で特許にはありません。"}, {"id": "54g12", "exam": 54, "part": "学科", "no": 12, "ans": "ウ", "type": "choice", "stem": "ア～ウを比較して，商標登録出願の審査に関して，最も不適切と考えられるものはどれか。", "opts": [{"k": "ア", "t": "商品の用途を表示する文字のみからなる商標を使用し続けた結果，商標登録を受けることができる場合がある。"}, {"k": "イ", "t": "商品の品質の誤認を生じるおそれのある商標は商標登録を受けることができない。"}, {"k": "ウ", "t": "商標を使用する意思を有していなくても商標登録を受けることができる。"}], "neg": true, "topic": "商標", "exp": "商標登録を受けるには、その商標を使用する（予定の）意思が必要です。使い続けて識別力が出た結果、登録できる場合もあります。"}, {"id": "54g13", "exam": 54, "part": "学科", "no": 13, "ans": "イ", "type": "choice", "stem": "ア～ウを比較して，不正競争防止法に関して，最も適切と考えられるものはどれか。", "opts": [{"k": "ア", "t": "不正競争防止法には，不正競争の具体的列挙のほか，それらを包括する一般的な定義が規定されている。"}, {"k": "イ", "t": "不正競争防止法には，差止請求をすることができる権利が規定されるとともに，罰則についても規定されている。"}, {"k": "ウ", "t": "不正競争防止法は，不正な競争が行われることを防止して，文化の発展に寄与することを目的とする。"}], "neg": false, "topic": "その他", "exp": "不正競争防止法は、差止請求と罰則の両方を定めています。目的は「国民経済の健全な発展」で、文化の発展ではありません。"}, {"id": "54g14", "exam": 54, "part": "学科", "no": 14, "ans": "ウ", "type": "choice", "stem": "ア～ウを比較して，意匠登録に関して，最も不適切と考えられるものはどれか。", "opts": [{"k": "ア", "t": "機器の操作の用に供されるものに係る画像について，意匠登録を受けることができる。"}, {"k": "イ", "t": "店舗の内装を構成する物品に係る意匠が，内装全体として統一的な美感を起こさせるときは，意匠登録を受けることができる。"}, {"k": "ウ", "t": "建築物について，意匠登録を受けることはできない。"}], "neg": true, "topic": "意匠", "exp": "建築物も意匠登録できます（令和元年改正）。内装の意匠や画像の意匠も登録できます。"}, {"id": "54g15", "exam": 54, "part": "学科", "no": 15, "ans": "ウ", "type": "choice", "stem": "ア～ウを比較して，著作権又は著作者人格権に関して，最も適切と考えられるものはどれか。", "opts": [{"k": "ア", "t": "著作権は一部譲渡が可能ではあるが，表現形式の変更を伴う翻案権は譲渡することはできない。"}, {"k": "イ", "t": "共同著作物に係る著作者人格権は，他の共有者の同意を得れば譲渡することができる。"}, {"k": "ウ", "t": "著作権及び著作者人格権の享有には，いかなる方式の履行をも要しない。"}], "neg": false, "topic": "著作権", "exp": "著作権・著作者人格権は、登録などの手続なしで発生します（無方式主義）。著作者人格権は譲渡できず、翻案権は譲渡できます。"}, {"id": "54g16", "exam": 54, "part": "学科", "no": 16, "ans": "ウ", "type": "choice", "stem": "ア～ウを比較して，契約の有効要件に関して，最も不適切と考えられるものはどれか。", "opts": [{"k": "ア", "t": "特許権を有する者が特許権譲渡契約を締結した際に錯誤に陥っていた場合，当該契約を取り消すことができるほか，取消しを主張しないで譲渡対価を請求することもできる。"}, {"k": "イ", "t": "共同開発契約の内容が公序良俗に反する場合，契約当事者双方が契約内容を受容したとしても，契約内容の履行を強制することはできない。"}, {"k": "ウ", "t": "未成年者が自己の創作した著作物についてライセンス契約を締結するには，法定代理人の同意が必要であり，同意なくしてなされた契約は無効である。"}], "neg": true, "topic": "その他", "exp": "未成年者が同意なくした契約は、「無効」ではなく「取り消せる」契約です。錯誤の取消しと公序良俗違反の記述は正しいです。"}, {"id": "54g17", "exam": 54, "part": "学科", "no": 17, "ans": "ウ", "type": "choice", "stem": "ア～ウを比較して，特許協力条約（PCT）の利点に関して，最も適切と考えられるものはどれか。", "opts": [{"k": "ア", "t": "締約国で登録された特許権について，国際事務局を通じて一元に管理される。"}, {"k": "イ", "t": "保護を求める締約国における審査が，希望する1カ国で統一して行われる。"}, {"k": "ウ", "t": "締約国のいずれか1カ所の所定の受理官庁に所定の要件を満たす出願をすれば，国際出願日が認められる。"}], "neg": false, "topic": "条約", "exp": "PCTは、1か所の受理官庁に出願すれば全加盟国で国際出願日が認められる制度です。特許権の一元管理や、審査の統一はありません。"}, {"id": "54g18", "exam": 54, "part": "学科", "no": 18, "ans": "イ", "type": "choice", "stem": "ア～ウを比較して，商標法に規定されている制度として，最も適切と考えられるものはどれか。", "opts": [{"k": "ア", "t": "地理的表示保護制度"}, {"k": "イ", "t": "出願公開制度"}, {"k": "ウ", "t": "出願審査請求制度"}], "neg": false, "topic": "商標", "exp": "出願公開制度は商標法にあります。審査請求制度は特許・実用新案だけで、地理的表示は別の法律（GI法）の制度です。"}, {"id": "54g19", "exam": 54, "part": "学科", "no": 19, "ans": "イ", "type": "choice", "stem": "ア～ウを比較して，著作物に関して，最も適切と考えられるものはどれか。", "opts": [{"k": "ア", "t": "工業的技術を利用して量産できるものは，著作権法により保護される場合はない。"}, {"k": "イ", "t": "事実の伝達にすぎない雑報及び時事の報道は，言語の著作物に該当しない。"}, {"k": "ウ", "t": "裁判所の判決は，著作権法上，権利の目的とならないため，私人が判決を翻訳したものも，著作権法上，権利の目的とならない。"}], "neg": false, "topic": "著作権", "exp": "事実の伝達にすぎない雑報・時事報道は、言語の著作物に当たりません。量産品でも著作物になる場合があり、判決の翻訳も権利の対象になり得ます。"}, {"id": "54g20", "exam": 54, "part": "学科", "no": 20, "ans": "ア", "type": "choice", "stem": "ア～ウを比較して，商標登録に対する不使用取消審判に関して，最も不適切と考えられるものはどれか。", "opts": [{"k": "ア", "t": "商標権者が登録商標を使用していない場合，専用使用権者が登録商標を指定商品に使用している場合であっても，取消しの対象となり得る。"}, {"k": "イ", "t": "商標権者が審判の請求の登録前の3年以内に登録商標に類似する商標のみを指定商品に使用している場合，取消しの対象となり得る。"}, {"k": "ウ", "t": "商標権者が登録商標を外国においてのみ継続して指定商品に使用している場合，取消しの対象となり得る。"}], "neg": true, "topic": "商標", "exp": "専用使用権者や通常使用権者が使用していれば、取消しの対象になりません。アの「取消しの対象となり得る」が誤りです。"}, {"id": "54g21", "exam": 54, "part": "学科", "no": 21, "ans": "ウ", "type": "choice", "stem": "ア～ウを比較して，育成者権に関して，最も適切と考えられるものはどれか。", "opts": [{"k": "ア", "t": "育成者権者から登録品種の種苗を譲り受けた後に，さらにその譲渡された種苗を国内の第三者に譲渡する行為は，育成者権を侵害することになる。"}, {"k": "イ", "t": "育成者権者は，登録品種の名称を，業として独占的に利用する権利を専有する。"}, {"k": "ウ", "t": "育成者権者の許諾を得ることなく登録品種の種苗を生産する行為は，育成者権を侵害する可能性がある。"}], "neg": false, "topic": "種苗", "exp": "許諾なしで登録品種の種苗を生産すると、侵害になる可能性があります。譲り受けた種苗の再譲渡は侵害になりません。品種名称の独占権もありません。"}, {"id": "54g22", "exam": 54, "part": "学科", "no": 22, "ans": "ア", "type": "choice", "stem": "ア～ウを比較して，独占禁止法に関して，最も不適切と考えられるものはどれか。", "opts": [{"k": "ア", "t": "事業者が，他の事業者と共同して対価を決定し，公共の利益に反して，一定の取引分野における競争を実質的に制限する行為は，私的独占に該当する。"}, {"k": "イ", "t": "事業者が，不当に，相手方により差別的な対価をもって，商品を継続して供給することであって，他の事業者の事業活動を困難にさせるおそれがあるものは，不公正な取引方法に該当する。"}, {"k": "ウ", "t": "事業者が，いかなる方法をもってするかを問わず，他の事業者の事業活動を排除し，又は支配することにより，公共の利益に反して，一定の取引分野における競争を実質的に制限することは，私的独占に該当する。"}], "neg": true, "topic": "その他", "exp": "共同して価格を決めて競争を制限するのは「不当な取引制限（カルテル）」で、私的独占ではありません。"}, {"id": "54g23", "exam": 54, "part": "学科", "no": 23, "ans": "ウ", "type": "choice", "stem": "ア～ウを比較して，実演家人格権に含まれる権利として，最も不適切と考えられるものはどれか。", "opts": [{"k": "ア", "t": "同一性保持権"}, {"k": "イ", "t": "氏名表示権"}, {"k": "ウ", "t": "公表権"}], "neg": true, "topic": "著作権", "exp": "実演家人格権は、氏名表示権と同一性保持権の2つだけです。公表権はありません。"}, {"id": "54g24", "exam": 54, "part": "学科", "no": 24, "ans": "イ", "type": "choice", "stem": "ア～ウを比較して，創作が容易であることを理由に登録されない意匠として，最も適切と考えられるものはどれか。", "opts": [{"k": "ア", "t": "視覚に訴えるものと認められない意匠"}, {"k": "イ", "t": "公知意匠の構成要素の一部を他の意匠等に置き換えた意匠"}, {"k": "ウ", "t": "物品の機能を確保するために不可欠な形状のみからなる意匠"}], "neg": false, "topic": "意匠", "exp": "公知の意匠の一部を置き換えただけの意匠は、容易に創作できる（創作非容易性がない）として登録されません。"}, {"id": "54g25", "exam": 54, "part": "学科", "no": 25, "ans": "イ", "type": "choice", "stem": "ア～ウを比較して，著作権に関して，最も不適切と考えられるものはどれか。", "opts": [{"k": "ア", "t": "複製権とは，印刷，写真，複写，録音，録画その他の方法により有形的に再製する権利である。"}, {"k": "イ", "t": "頒布権は，有償・無償を問わず，著作物を公衆に譲渡又は貸与する権利で，映画の著作物は，譲渡権と貸与権とともに，この頒布権が認められている。"}, {"k": "ウ", "t": "送信可能化行為は，公衆送信権によって保護される。"}], "neg": true, "topic": "著作権", "exp": "頒布権が認められるのは映画の著作物で、映画には譲渡権・貸与権がありません。イの「譲渡権と貸与権とともに」が誤りです。"}, {"id": "54g26", "exam": 54, "part": "学科", "no": 26, "ans": "イ", "type": "choice", "stem": "ア～ウを比較して，商標権侵害であると警告された場合の対応として，最も不適切と考えられるものはどれか。", "opts": [{"k": "ア", "t": "登録商標が継続して3年以上使用されていないかを確認する。"}, {"k": "イ", "t": "登録異議の申立ての可否を判断するために，商標掲載公報が発行された日から6カ月経過していないかを確認する。"}, {"k": "ウ", "t": "実際に商標権が存在するか，警告者が商標権者であるかを商標登録原簿で確認する。"}], "neg": true, "topic": "商標", "exp": "登録異議の申立ては、商標掲載公報の発行から2か月以内です。6か月は誤りです。"}, {"id": "54g27", "exam": 54, "part": "学科", "no": 27, "ans": "ア", "type": "choice", "stem": "ア～ウを比較して，特許法における発明者として，最も不適切と考えられるものはどれか。", "opts": [{"k": "ア", "t": "合同会社"}, {"k": "イ", "t": "異なる企業に勤務する複数の従業者"}, {"k": "ウ", "t": "未成年者"}], "neg": true, "topic": "特許", "exp": "発明者になれるのは自然人（人間）だけで、会社は発明者になれません。複数企業の従業者の共同発明や、未成年者の発明は可能です。"}, {"id": "54g28", "exam": 54, "part": "学科", "no": 28, "ans": "イ", "type": "choice", "stem": "ア～ウを比較して，TRIPS協定に関して，最も不適切と考えられるものはどれか。", "opts": [{"k": "ア", "t": "TRIPS協定では，特許の対象として，物の発明に加え，方法の発明も認められている。"}, {"k": "イ", "t": "TRIPS協定では，パリ条約の三大原則の1つである内国民待遇は規定されていないが，最恵国待遇は規定されている。"}, {"k": "ウ", "t": "TRIPS協定では，特許権について規定され，商標権についても規定されている。"}], "neg": true, "topic": "条約", "exp": "TRIPS協定は、内国民待遇と最恵国待遇の両方を定めています。"}, {"id": "54g29", "exam": 54, "part": "学科", "no": 29, "ans": "ア", "type": "choice", "stem": "ア～ウを比較して，二次的著作物に関して，最も不適切と考えられるものはどれか。", "opts": [{"k": "ア", "t": "二次的著作物の著作権を譲渡する場合，原著作物の著作権も同時に譲渡しなければならない。"}, {"k": "イ", "t": "二次的著作物とは，著作物を翻訳し，編曲し，若しくは変形し，又は脚色し，映画化し，その他翻案することにより創作した著作物をいう。"}, {"k": "ウ", "t": "二次的著作物を利用する際は，二次的著作物の著作権者だけでなく，原著作物の著作権者の許諾も得る必要がある。"}], "neg": true, "topic": "著作権", "exp": "二次的著作物の著作権だけを譲渡できます。原著作物の著作権と同時に譲渡する必要はありません。"}, {"id": "54g30", "exam": 54, "part": "学科", "no": 30, "ans": "ウ", "type": "choice", "stem": "ア～ウを比較して，同一の発明について，同日に二以上の特許出願があった場合の取扱として，最も不適切と考えられるものはどれか。", "opts": [{"k": "ア", "t": "いずれの特許出願人も特許を受けることができない場合がある。"}, {"k": "イ", "t": "特許出願人に対しては，特許庁長官から協議命令が出される。"}, {"k": "ウ", "t": "特許庁長官が行う公正な方法によるくじにより定めた特許出願人が特許を受けることができる場合がある。"}], "neg": true, "topic": "特許", "exp": "同日に同じ発明が出願された場合は協議で1人に決め、協議が成立しないと誰も特許を受けられません。くじ引きはありません。"}, {"id": "54j1", "exam": 54, "part": "実技", "no": 1, "ans": "×", "ctx": "中小企業であるロボットメーカーX社の技術者甲は，調理用のロボットAの開発を担当している。甲は，ロボットAに係る発明についての特許出願に関して，同僚の乙に相談をしている。甲と乙は会話1～2をしている。\n会話1 甲 「私が，新開発のロボットAに係る発明をしたので，特許出願の発明者の欄には私の名前を記載することになりますよね。」\n乙 「ロボットAに係る発明は職務発明に該当し，X社を出願人として特許出願しますので，発明者は甲さんではなくX社となります。」\n会話2 甲 「総務部の人から特許出願をするための明細書を書くように指示されました。特許庁の審査に通るためにはどのように書けばよいですか。」\n乙 「ロボットAに係る発明の属する技術分野における共通の知識を有する者が，その発明を理解することができる程度に明確かつ十分に記載する必要があります。」", "type": "maru", "stem": "会話1について，適切と考えられる場合は「○」を，不適切と考えられる場合は「×」を，選びなさい。", "opts": [{"k": "○", "t": ""}, {"k": "×", "t": ""}], "neg": false, "topic": "特許", "exp": "発明者になれるのは自然人だけです。会社は出願人にはなれますが、発明者にはなれません。"}, {"id": "54j2", "exam": 54, "part": "実技", "no": 2, "ans": "イ", "ctx": "中小企業であるロボットメーカーX社の技術者甲は，調理用のロボットAの開発を担当している。甲は，ロボットAに係る発明についての特許出願に関して，同僚の乙に相談をしている。甲と乙は会話1～2をしている。\n会話1 甲 「私が，新開発のロボットAに係る発明をしたので，特許出願の発明者の欄には私の名前を記載することになりますよね。」\n乙 「ロボットAに係る発明は職務発明に該当し，X社を出願人として特許出願しますので，発明者は甲さんではなくX社となります。」\n会話2 甲 「総務部の人から特許出願をするための明細書を書くように指示されました。特許庁の審査に通るためにはどのように書けばよいですか。」\n乙 「ロボットAに係る発明の属する技術分野における共通の知識を有する者が，その発明を理解することができる程度に明確かつ十分に記載する必要があります。」", "type": "choice", "stem": "【理由群Ⅰ】の中から，問1において適切又は不適切と判断した理由として，最も適切と考えられるものを1つ選びなさい。", "opts": [{"k": "ア", "t": "職務発明については，いわゆる予約取得がされている場合には，出願人とは無関係に，発明をした者の勤務先の会社が発明者となるため"}, た記事を見つけました。この記事は，雑誌社Y社が作成した記事ですが，わが社の製品に関する記事なので，社内で周知したいと思います。この場合，Y社の記事であることを明示すれば，Y社の許諾を得ることなく，その記事をスクリーンショットした画像をわが社の社内ネットワーク上の掲示板に掲載することができます。」\n発言2 「甲は，技術部のリーダーとして中心的な役割を果たし，アプリケーションAを作成しました。一方で，アプリケーションAの作成時における契約や勤務規則においては，著作者の取扱に関する定めはありません。この場合，わが社はこのアプリケーションAを，甲の許諾を得ることなくバージョンアップすることができます。」", "type": "maru", "stem": "発言1について，適切と考えられる場合は「○」を，不適切と考えられる場合は「×」を，選びなさい。", "opts": [{"k": "○", "t": ""}, {"k": "×", "t": ""}], "neg": false, "topic": "著作権", "exp": "雑誌記事のスクリーンショットを社内掲示板に載せるのは、引用の要件を満たさない複製です。出所を書いても許諾は必要です。"}, {"id": "54j6", "exam": 54, "part": "実技", "no": 6, "ans": "エ", "ctx": "アプリケーション開発会社X社は，今年の冬にアプリケーションAの発売を予定している。X社の技術部のプログラマー甲は，アプリケーションAの作成に従事している。X社の法務部の部員乙は，アプリケーションAについて発言1～2をしている。なお，著作権の譲渡は行われていないものとする。\n発言1 「先日，ネット記事を読んでいたところ，アプリケーションAを含めたいくつかのアプリケーションを紹介した記事を見つけました。この記事は，雑誌社Y社が作成した記事ですが，わが社の製品に関する記事なので，社内で周知したいと思います。この場合，Y社の記事であることを明示すれば，Y社の許諾を得ることなく，その記事をスクリーンショットした画像をわが社の社内ネットワーク上の掲示板に掲載することができます。」\n発言2 「甲は，技術部のリーダーとして中心的な役割を果たし，アプリケーションAを作成しました。一方で，アプリケーションAの作成時における契約や勤務規則においては，著作者の取扱に関する定めはありません。この場合，わが社はこのアプリケーションAを，甲の許諾を得ることなくバージョンアップすることができます。」", "type": "choice", "stem": "【理由群Ⅲ】の中から，問5において適切又は不適切と判断した理由として，最も適切と考えられるものを1つ選びなさい。", "opts": [{"k": "ア", "t": "引用にあたるため"}, {"k": "イ", "t": "Y社の展示権を侵害するため"}, {"k": "ウ", "t": "私的使用の複製にあたるため"}, {"k": "エ", "t": "Y社の複製権を侵害するため"}], "neg": false, "topic": "著作権", "exp": "理由はエ。無断の複製は複製権の侵害になります。"}, {"id": "54j7", "exam": 54, "part": "実技", "no": 7, "ans": "○", "ctx": "アプリケーション開発会社X社は，今年の冬にアプリケーションAの発売を予定している。X社の技術部のプログラマー甲は，アプリケーションAの作成に従事している。X社の法務部の部員乙は，アプリケーションAについて発言1～2をしている。なお，著作権の譲渡は行われていないものとする。\n発言1 「先日，ネット記事を読んでいたところ，アプリケーションAを含めたいくつかのアプリケーションを紹介した記事を見つけました。この記事は，雑誌社Y社が作成した記事ですが，わが社の製品に関する記事なので，社内で周知したいと思います。この場合，Y社の記事であることを明示すれば，Y社の許諾を得ることなく，その記事をスクリーンショットした画像をわが社の社内ネットワーク上の掲示板に掲載することができます。」\n発言2 「甲は，技術部のリーダーとして中心的な役割を果たし，アプリケーションAを作成しました。一方で，アプリケーションAの作成時における契約や勤務規則においては，著作者の取扱に関する定めはありません。この場合，わが社はこのアプリケーションAを，甲の許諾を得ることなくバージョンアップすることができます。」", "type": "maru", "stem": "発言2について，適切と考えられる場合は「○」を，不適切と考えられる場合は「×」を，選びなさい。", "opts": [{"k": "○", "t": ""}, {"k": "×", "t": ""}], "neg": false, "topic": "著作権", "exp": "職務著作の要件（会社の発意・業務従事者・職務上の作成・会社名義の公表）を満たせば、著作者は会社です。プログラムは名義の公表が要件になりません。著作者がX社なので、甲の許諾なしにバージョンアップできます。"}, {"id": "54j8", "exam": 54, "part": "実技", "no": 8, "ans": "イ", "ctx": "アプリケーション開発会社X社は，今年の冬にアプリケーションAの発売を予定している。X社の技術部のプログラマー甲は，アプリケーションAの作成に従事している。X社の法務部の部員乙は，アプリケーションAについて発言1～2をしている。なお，著作権の譲渡は行われていないものとする。\n発言1 「先日，ネット記事を読んでいたところ，アプリケーションAを含めたいくつかのアプリケーションを紹介した記事を見つけました。この記事は，雑誌社Y社が作成した記事ですが，わが社の製品に関する記事なので，社内で周知したいと思います。この場合，Y社の記事であることを明示すれば，Y社の許諾を得ることなく，その記事をスクリーンショットした画像をわが社の社内ネットワーク上の掲示板に掲載することができます。」\n発言2 「甲は，技術部のリーダーとして中心的な役割を果たし，アプリケーションAを作成しました。一方で，アプリケーションAの作成時における契約や勤務規則においては，著作者の取扱に関する定めはありません。この場合，わが社はこのアプリケーションAを，甲の許諾を得ることなくバージョンアップすることができます。」", "type": "choice", "stem": "【理由群Ⅳ】の中から，問7において適切又は不適切と判断した理由として，最も適切と考えられるものを1つ選びなさい。", "opts": [{"k": "ア", "t": "甲とX社が著作者であるため"}, {"k": "イ", "t": "X社が著作者であるため"}, {"k": "ウ", "t": "甲が著作者であるため"}, {"k": "エ", "t": "甲とX社は著作者ではないため"}], "neg": false, "topic": "著作権", "exp": "理由はイ。著作者がX社なので、X社が自由に改変できます。"}, {"id": "54j9", "exam": 54, "part": "実技", "no": 9, "ans": "ア", "type": "choice", "stem": "家電メーカーX社は，新しく開発した冷却ユニットについて特許出願することを検討している。ア～ウを比較して，X社の考えとして，最も不適切と考えられるものを1つ選びなさい。", "opts": [{"k": "ア", "t": "ドイツで開催された国際家電見本市で冷却ユニットを展示しても，その後に日本へ特許出願する場合は，新規性を有する。"}, {"k": "イ", "t": "冷却ユニットのプレスリリースが午後に行われる場合に，同日の午前中に特許出願する場合は，新規性を有する。"}, {"k": "ウ", "t": "顧客に冷却ユニットを提示して説明した場合であっても，その顧客との間で秘密保持契約を締結している場合は，新規性を有する。"}], "neg": true, "topic": "特許", "exp": "外国の展示会での公開も公知になり、新規性を失います。新規性喪失の例外の手続をしない限り、アの「新規性を有する」は誤りです。"}, {"id": "54j10", "exam": 54, "part": "実技", "no": 10, "ans": "ウ", "type": "choice", "stem": "靴メーカーX社は，ジョギング用のシューズAについて意匠権Dを保有している。Y社が販売しているジョギング用のシューズBが，シューズAのデザインと類似していることがわかった。ア～ウを比較して，X社の考えとして，最も適切と考えられるものを1つ選びなさい。", "opts": [{"k": "ア", "t": "Y社の行為は意匠権Dの侵害に該当するが，日本国内で一切生産せず輸入のみを行っている場合には，意匠権Dの侵害に該当せず，損害賠償請求をすることはできない。"}, {"k": "イ", "t": "シューズAとシューズBのデザインは全体としてきわめてよく類似しているが，同一のデザインではないので，Y社に対して差止請求をすることはできない。"}, {"k": "ウ", "t": "意匠権Dに係る意匠登録出願より前にY社がすでにシューズBを日本国内で販売していた場合には，Y社に対する損害賠償請求は認められない。"}], "neg": false, "topic": "意匠", "exp": "出願前から類似品を国内で販売していたY社は、先使用権などで権利行使を受けない可能性があり、損害賠償請求は認められません。輸入のみでも侵害になり、類似のデザインでも差止めできます。"}, {"id": "54j11", "exam": 54, "part": "実技", "no": 11, "ans": "ウ", "type": "choice", "stem": "医薬品メーカーX社は，新規な商品に関して商標登録出願をすべきか否かを検討している。ア～ウを比較して，X社の考えとして，最も不適切と考えられるものを1つ選びなさい。", "opts": [{"k": "ア", "t": "商標を使用した商品の広告に起用する独自のキャラクターのマスコット人形について，商標登録出願をすべきである。"}, {"k": "イ", "t": "商品のパッケージについて，ユニークなデザインの包装紙を使用しているので，商標登録出願をすべきである。"}, {"k": "ウ", "t": "形状が特徴的な立体的形状の容器について，商標登録を受けることはできない。"}], "neg": true, "topic": "商標", "exp": "立体的形状も立体商標として登録できます。ウの「できない」が誤りです。"}, {"id": "54j12", "exam": 54, "part": "実技", "no": 12, "ans": "イ", "type": "choice", "stem": "事務用品メーカーX社は，斬新な模様Aを有する手帳の意匠について意匠権Dを有している。X社の営業部の部員は，Y社が，X社の許可なく模様Aを利用していることを知った。ア～ウを比較して，X社がY社に対して，意匠権Dの行使ができる可能性が高い場合として，最も適切と考えられるものを1つ選びなさい。", "opts": [{"k": "ア", "t": "Y社が，模様Aを有するボールペンを製造している場合"}, {"k": "イ", "t": "Y社が，模様Aを有する手帳と万年筆を組み合わせて販売している場合"}, {"k": "ウ", "t": "Y社が，模様Aを有する手帳の写真を自社製品との比較広告に掲載している場合"}], "neg": false, "topic": "意匠", "exp": "手帳と万年筆のセット販売は、模様Aの手帳を販売する行為なので、意匠権を行使できます。ボールペンは非類似の物品で、広告への写真掲載は実施行為ではありません。"}, {"id": "54j13", "exam": 54, "part": "実技", "no": 13, "ans": "ア", "type": "choice", "stem": "情報通信機器メーカーであるX社は，発明Aについて特許協力条約（PCT）による国際出願をすることとした。ア～ウを比較して，国際出願に関して，最も不適切と考えられるものを1つ選びなさい。", "opts": [{"k": "ア", "t": "わが国の特許庁を受理官庁として国際出願する場合は，日本語で書類を作成しなければならない。"}, {"k": "イ", "t": "X社はわが国において設立された法人であるが，わが国の特許庁ではなく世界知的所有権機関（WIPO）の国際事務局に国際出願をすることもできる。"}, {"k": "ウ", "t": "わが国の特許庁は，受理官庁として国際出願を受理し，かつ国際調査機関としてその受理した国際出願について国際調査をすることがある。"}], "neg": true, "topic": "条約", "exp": "日本の特許庁へのPCT出願は、日本語または英語で書類を作成できます。「日本語でなければならない」が誤りです。"}, {"id": "54j14", "exam": 54, "part": "実技", "no": 14, "ans": "ウ", "type": "choice", "stem": "大学生甲は，地域の子供とその親を対象に，絵本の読み聞かせの活動を行うことを計画している。ア～ウを比較して，甲が絵本の著作権者の許諾を得ずに読み聞かせを行うことができるための要件として，最も不適切と考えられるものを1つ選びなさい。", "opts": [{"k": "ア", "t": "子供や親から料金を受けないこと"}, {"k": "イ", "t": "当該活動が営利を目的としないこと"}, {"k": "ウ", "t": "甲が絵本を購入すること"}], "neg": true, "topic": "著作権", "exp": "非営利・無料・無報酬なら、絵本の読み聞かせ（上演・口述）は許諾なしでできます。絵本を購入することは要件ではありません。"}, {"id": "54j15", "exam": 54, "part": "実技", "no": 15, "ans": "ウ", "type": "choice", "stem": "ア～ウを比較して，特許を受けることができる発明として，最も適切と考えられるものを1つ選びなさい。", "opts": [{"k": "ア", "t": "商品の型番・仕様・価格・使用方法を表記した製品カタログ"}, {"k": "イ", "t": "来店毎にスタンプを押し，10個貯まると店長が割引券を発行する会員制度"}, {"k": "ウ", "t": "人が地中に設置した振動センサの時系列データを解析し，地震を予知する装置"}], "neg": false, "topic": "特許", "exp": "地震を予知する装置（センサのデータを解析する装置）は、自然法則を利用した技術的思想なので発明です。カタログや会員制度は発明に当たりません。"}, {"id": "54j16", "exam": 54, "part": "実技", "no": 16, "ans": "イ", "type": "choice", "stem": "食品メーカーX社は，特許権P，実用新案権U，商標権Mを有している。X社では，知的財産権に基づいた権利行使について検討している。ア～ウを比較して，X社の考えとして，最も適切と考えられるものを1つ選びなさい。", "opts": [{"k": "ア", "t": "商標権Mに基づいて差止請求権を行使する場合には，事前に相手方に警告する必要がある。"}, {"k": "イ", "t": "実用新案権Uに基づいて差止請求権を行使する場合には，実用新案技術評価書を提示して事前に相手方に警告する必要がある。"}, {"k": "ウ", "t": "特許権Pに基づいて差止請求権を行使する場合には，事前に相手方に警告する必要がある。"}], "neg": false, "topic": "実用新案", "exp": "実用新案権の権利行使では、実用新案技術評価書を提示して警告する必要があります。特許権・商標権は、警告なしでも権利行使できます。"}, {"id": "54j17", "exam": 54, "part": "実技", "no": 17, "ans": "ア", "type": "choice", "stem": "自動車メーカーX社は，開発中の新しい電気自動車に関し，当初は意匠登録出願の直後に製品発表をする予定であったが，意匠登録出願後に，製品発表時期を大幅に延期することとなった。意匠登録出願の際には秘密意匠の請求をしていなかったことから，対応を検討している。ア～ウを比較して，X社の考えとして，最も適切と考えられるものを1つ選びなさい。", "opts": [{"k": "ア", "t": "秘密意匠の請求は意匠登録査定後であってもできるが，第1年分の登録料の納付と同時に行う必要がある。"}, {"k": "イ", "t": "すでに意匠登録出願をしており，秘密意匠にするためには，一度意匠登録出願を取り下げて，秘密意匠の請求とともに意匠登録出願をし直す必要がある。"}, {"k": "ウ", "t": "意匠登録出願後であっても秘密意匠の請求はできるが，出願後6カ月以内に手続する必要がある。"}], "neg": false, "topic": "意匠", "exp": "秘密意匠の請求は、出願と同時、または第1年分の登録料の納付と同時にできます。出願のし直しや6か月以内の制限はありません。"}, {"id": "54j18", "exam": 54, "part": "実技", "no": 18, "ans": "イ", "type": "choice", "stem": "飲料メーカーX社は，指定商品aについて商標「ABC」に係る商標権Mを取得し，その後に当該商標の使用を開始した。X社の商品aは，爆発的なヒット商品となり，市場シェアが高まり，取引者の間では，他社の製品であっても商品aについては「ABC」の名前で呼ばれることが多くなった。ア～ウを比較して，X社の考えとして，最も適切と考えられるものを1つ選びなさい。", "opts": [{"k": "ア", "t": "X社は，商品aについて，他社製品も含めて「ABC」と呼ばれるのは，X社の製品が著名であることを証明するものであり，また商標のライセンス料が得られる可能性もあると考え，しばらく現在の状況を放置することとした。"}, {"k": "イ", "t": "X社は，商標権Mの効力が制限される可能性もあると考え，商品aについて商標「ABC」を使用する場合には，X社の登録商標である旨を明記することとした。"}, {"k": "ウ", "t": "X社は，取引者の間で，商品aについては「ABC」と呼ばれることになったことから，商標権Mに係る商標登録は無効理由を有すると考え，商標「ABC」の使用を中止し，新たな商標を使用することにした。"}], "neg": false, "topic": "商標", "exp": "商品名が普通名称化すると、商標権の効力が制限されるおそれがあります。登録商標であることを明記して対策します。放置はよくありません。"}, {"id": "54j19", "exam": 54, "part": "実技", "no": 19, "ans": "ア", "type": "choice", "stem": "ア～ウを比較して，著作権法上，著作物として保護されるものとして，最も不適切と考えられるものを1つ選びなさい。", "opts": [{"k": "ア", "t": "「日本で一番長い川は信濃川である。」という文"}, {"k": "イ", "t": "即興で演奏した楽曲"}, {"k": "ウ", "t": "イタリアに居住する日本国民が創作し，イタリアで公表された小説"}], "neg": true, "topic": "著作権", "exp": "事実を述べただけの文は創作性がなく、著作物ではありません。即興演奏の楽曲や、海外居住の日本国民の小説は保護されます。"}, {"id": "54j20", "exam": 54, "part": "実技", "no": 20, "ans": "イ", "type": "choice", "stem": "甲は，新しい品種Aの開発に成功し，品種Aについて品種登録を受けた。甲が品種Aの生産販売を始めるために市場を調査したところ，乙が品種Aの育成方法について特許権を取得し，特許された育成方法で育成した品種Aの生産販売をしていることが判明した。ア～ウを比較して，甲の考えとして，最も適切と考えられるものを1つ選びなさい。", "opts": [{"k": "ア", "t": "乙による品種Aの生産販売の開始が，甲の品種登録出願の日より後であれば，甲は乙に対して，品種Aに係る育成者権に基づく権利を行使することができる。"}, {"k": "イ", "t": "甲は乙に対して，品種Aに係る育成者権に基づいて，品種Aの生産販売の差止めを請求することができない。"}, {"k": "ウ", "t": "品種Aに係る特許権と育成者権の両権利について，調整規定は設けられていない。"}], "neg": false, "topic": "種苗", "exp": "育成者権と特許権の関係には調整規定があり（ウは誤り）、この問題では育成者権に基づく差止めはできない（イ）とされています。出題頻度が低いので深追い不要です。"}, {"id": "54j21", "exam": 54, "part": "実技", "no": 21, "ans": "イ", "type": "choice", "stem": "音響機器メーカーX社は，増幅器付きスピーカーについて意匠権Dを有している。音響機器メーカーY社は，X社の意匠権Dに係る登録意匠と類似する形態を，増幅器付きスピーカーと類似する物品である増幅器の形態に転用することを検討している。ア～ウを比較して，Y社の考えとして，最も不適切と考えられるものを1つ選びなさい。", "opts": [{"k": "ア", "t": "わが社は，X社から意匠権Dについて物品を増幅器に限定した通常実施権の許諾を受けることができる。"}, {"k": "イ", "t": "わが社は，X社から意匠権Dについて専用実施権の設定を受ける当事者間契約をしたので，専用実施権として効力を生じさせるために特許庁への登録の必要はない。"}, {"k": "ウ", "t": "意匠権DはX社とW社との共有であるので，X社がW社から同意を得られれば，わが社は，X社から意匠権Dについて通常実施権の許諾を受けることができる。"}], "neg": true, "topic": "意匠", "exp": "専用実施権は、特許庁への登録が効力発生の条件です。イの「登録の必要はない」が誤りです。"}, {"id": "54j22", "exam": 54, "part": "実技", "no": 22, "ans": "ア", "type": "choice", "stem": "映画会社X社は，小説家甲が執筆した小説Aを原作とする映画Bを製作した。社外の乙は，X社に対し映画Bの著作物の製作に参加することを約束した上で，映画監督を担当した。丙は，脚本を担当した。ア～ウを比較して，映画Bの著作物の著作権者として，最も適切と考えられるものを1つ選びなさい。", "opts": [{"k": "ア", "t": "X社"}, {"k": "イ", "t": "甲と丙"}, {"k": "ウ", "t": "乙"}], "neg": false, "topic": "著作権", "exp": "映画の著作物では、製作への参加を約束した監督（乙）の著作権は、映画製作者のX社に帰属します。"}, {"id": "54j23", "exam": 54, "part": "実技", "no": 23, "ans": "ア", "type": "choice", "stem": "靴メーカーX社は，靴A，靴B，靴Cを企画し，製造した。X社はこれらの靴について意匠登録による保護ができないかどうか検討している。ア～ウを比較して，X社の考えとして，最も適切と考えられるものを1つ選びなさい。", "opts": [{"k": "ア", "t": "靴Aは，昭和に活躍したアイドル歌手が使用していた靴を忠実に再現したものであり，意匠登録されることはない。"}, {"k": "イ", "t": "靴Bは，新たに開発した素材を用いたデザインであり，防水性が高く軽量であるという技術的な特徴を有するから，特許で保護すべきであり，意匠登録されることはない。"}, {"k": "ウ", "t": "靴Cは，来シーズンのトレンドを意識したファッション性の高い靴であり，このような靴を1社が独占すると市場が混乱するから，意匠登録されることはない。"}], "neg": false, "topic": "意匠", "exp": "昭和のアイドルが使った靴を忠実に再現した靴は、公知の意匠なので新規性がなく登録されません。技術的な特徴があっても、ファッション性が高くても、意匠登録はできます。"}, {"id": "54j24", "exam": 54, "part": "実技", "no": 24, "ans": "イ", "type": "choice", "stem": "ア～ウを比較して，実用新案法の保護対象である考案として，最も不適切と考えられるものを1つ選びなさい。", "opts": [{"k": "ア", "t": "ロボット制御用コンピュータに使用する半導体チップを製造するための微細加工が可能な半導体製造装置"}, {"k": "イ", "t": "ドラム式洗濯機において，洗濯中の衣類が，からまないようにするためのドラム内におけるからみ防止用の棒の配置方法"}, {"k": "ウ", "t": "病院で人間のB型肝炎予防接種のために用いる特殊な形状をした使い捨て注射針"}], "neg": true, "topic": "実用新案", "exp": "実用新案の対象は物品の形状・構造・組合せです。「配置方法」のように方法として表したものは対象外です。"}, {"id": "54j25", "exam": 54, "part": "実技", "no": 25, "ans": "ア", "type": "choice", "stem": "自動車部品メーカーX社の知的財産部の部員が，特許協力条約（PCT）による国際出願（PCTルート）と，パリ条約上の優先権の主張を利用した外国出願（パリルート）のメリットとデメリットについて検討している。ア～ウを比較して，部員の考えとして，最も適切と考えられるものを1つ選びなさい。", "opts": [{"k": "ア", "t": "PCTルートによるメリットとしては，1カ所の特許庁に出願しただけで，その国際出願について国際出願日が認められ，すべての指定国について正規に国内出願をしたものとして取り扱われる。"}, {"k": "イ", "t": "パリルートでは最初の出願日から12カ月以内に後の外国出願を行わなければならないが，PCTルートでは各指定国に翻訳を提出する等の国内移行手続に36カ月という時間を指定国で必ず得られるので，出願人はどの国で権利取得手続を進めるかを十分に検討できる。"}, {"k": "ウ", "t": "PCTルートを利用する場合，パリルートと比較して，外国特許の取得にかかるトータルの費用は安くなるが，各国における願書や明細書等の書式が不統一のため手続的負担が大きい。"}], "neg": false, "topic": "条約", "exp": "PCTは、1か所の特許庁に出願すれば全指定国で出願日が認められる制度です。国内移行は原則30か月で、費用が必ず安くなるわけではありません。"}, {"id": "54j26", "exam": 54, "part": "実技", "no": 26, "ans": "イ", "type": "choice", "stem": "映画Aは，甲が映画監督を務め，2013年3月1日に完成し，2015年7月1日に公開された。その後，甲は2022年10月1日に亡くなった。ア～ウを比較して，映画Aに係る著作権の存続期間が満了する年月日として，最も適切と考えられるものを1つ選びなさい。", "opts": [{"k": "ア", "t": "2083年12月31日"}, {"k": "イ", "t": "2085年12月31日"}, {"k": "ウ", "t": "2092年12月31日"}], "neg": false, "topic": "著作権", "exp": "映画の著作権は公表後70年で、公表の翌年から数えて70年目の末日までです。2015年7月公表なので、2085年12月31日です。"}, {"id": "54j27", "exam": 54, "part": "実技", "no": 27, "ans": "202801", "type": "num", "stem": "文房具メーカーX社は，2025年1月15日に行った特許出願Pについて，2025年3月26日に出願公開の請求を行い，2025年4月23日に出願公開がされた。特許出願Pについて出願審査の請求をすることができる最終日が属するのは西暦何年何月か，記入例に従って算用数字で記入しなさい。\n記入例 西暦2010年1月の場合は，「201001」と6桁の算用数字で左詰めで記入", "opts": [], "neg": false, "topic": "特許", "exp": "審査請求は出願日から3年以内です。2025年1月15日の出願なので最終日は2028年1月15日で、2028年1月です。出願公開の請求は関係ありません。"}, {"id": "54j28", "exam": 54, "part": "実技", "no": 28, "ans": "イ", "type": "choice", "ctx": "次の会話は，家具メーカーX社の知的財産部の部員甲と部員乙のものである。問28～問30に答えなさい。\n甲 「わが社の新製品の事務用椅子に使用する予定の商標Mと商標Nについて，いずれも事務用椅子を指定商品とし商標登録出願したいと考えています。」\n乙 「わかりました。その場合，1通の商標登録出願として ［1］ 。」\n甲 「商標Nについては，指定商品を事務用椅子と事務机の両方について商標登録出願したいと考えています。」\n乙 「その場合，1通の商標登録出願として ［2］ 。」\n甲 「商標Mについては，将来別の商品にも使用する可能性がありますが，まだ決定していません。商標登録出願した後，指定商品を追加することはできますか。」\n乙 「その場合，商標登録出願後に指定商品を追加すること ［3］ 。」", "stem": "【語群Ⅴ】の中から空欄［1］に入る語句として最も適切と考えられるものを1つ選びなさい。", "opts": [{"k": "ア", "t": "出願することができます"}, {"k": "イ", "t": "出願することはできません"}, {"k": "ウ", "t": "両者が類似する場合に限り出願することができます"}, {"k": "エ", "t": "ができます"}, {"k": "オ", "t": "はできません"}, {"k": "カ", "t": "その出願に係る指定商品である事務用椅子に類似する商品についてであればできます"}], "neg": false, "topic": "商標", "exp": "商標登録出願は、1つの商標ごとに1通です。商標MとNを1通にまとめて出願することはできません。"}, {"id": "54j29", "exam": 54, "part": "実技", "no": 29, "ans": "ア", "type": "choice", "ctx": "次の会話は，家具メーカーX社の知的財産部の部員甲と部員乙のものである。問28～問30に答えなさい。\n甲 「わが社の新製品の事務用椅子に使用する予定の商標Mと商標Nについて，いずれも事務用椅子を指定商品とし商標登録出願したいと考えています。
